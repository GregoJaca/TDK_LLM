analysis:
  metric: ["median", "harmonic", "p10", "p25", "p75", "p90", "min", "max"]
  error_bars: "fan"    # Options: none, std, var, fan

plotting:
  metric: ["harmonic"]  # Options: mean, median, mode, harmonic
  error_bars: "fan"    # "none" "var" "std" "fan"
  plot_prompt_together: true
  plot_prompt_separated: true
  separate_figure_metrics: true
  x_scales: ["linear"]
  y_scales: ["log"]
  plot_heatmap: false
  plot_swarm: true
  plot_spectral_norms: true
  plot_lambda_true: true
  plot_weight_svds: true
  plot_scaled_frobenius: true
  plot_activation_densities: true
  plot_attention_entropy: true
  plot_static_weights: true
  plot_spectral_gaps: true
  plot_token_sensitivity: true
  show_title: false
  font_size: 16
  label_size: 14
  tick_size: 12
  legend_size: 11
  dpi: 300

          The United States of America (USA), also known as the United States (U.S.) or
          America, is a country primarily located in North America. It is a federal
          republic consisting of 50 states and a federal capital district, Washington,
          D.C. The 48 contiguous states border Canada to the north and Mexico to the
          south, with the semi-exclave of Alaska in the northwest and the archipelago of
          Hawaii in the Pacific Ocean. The United States also asserts sovereignty over
          five major island territories and various uninhabited islands in Oceania and the
          Caribbean. It is a megadiverse country, with the world's third-largest land area
          and third-largest population, exceeding 341 million. Paleo-Indians first
          migrated from North Asia to North America at least 15,000 years ago, and formed
          various civilizations. European discovery of the Americas began in 1492, and
          British colonization followed with the 1607 settlement of Virginia, the first of
          the Thirteen Colonies. The American Enlightenment that spread throughout the
          colonies in the 18th century valued republicanism and liberalism. Clashes with
          the British Crown over taxation without parliamentary representation and the
          denial of other English rights evolved into the American Revolution, which led
          to the Declaration of Independence on July 4, 1776. Victory in the 1775–1783
          Revolutionary War brought international recognition of the country's
          sovereignty. Rapid westward territorial expansion followed the purchase,
          settlement, and conquest of European-held or Indigenous-controlled territory. As
          more states were admitted into the Union, a North–South division over slavery
          led 11 Southern states to declare secession and join as the Confederate States
          of America in order to preserve slavery there. These states fought against the
          Union in the American Civil War of 1861–1865 but were defeated. With the United
          States' victory and reunification, slavery was abolished nationally. By 1900,
          the country had established itself as a great power, a status solidified after
          its involvement during World War I. Following Japan's attack on Pearl Harbor in
          1941, the U.S. entered World War II on the side of the Allies. Its aftermath
          left the U.S. and the Soviet Union as rival superpowers, competing for
          ideological dominance and international influence during the Cold War. The
          Soviet Union's collapse in 1991 left the U.S. the world's sole superpower until
          the early 2020s, when China began to be viewed as a rival superpower. The U.S.
          federal government is a representative democracy with a president and a
          constitution that creates a separation of powers among three branches:
          legislative, executive, and judicial. The United States Congress is a bicameral
          national legislature composed of the House of Representatives (a lower house
          based on population) and the Senate (an upper house based on equal
          representation for each state). Federalism grants substantial autonomy to the 50
          states. In addition, 574 Native American tribes have sovereignty rights, and
          there are 326 Native American reservations. A developed country, the U.S. ranks
          high in economic competitiveness, innovation, and higher education. Accounting
          for over a quarter of nominal global GDP, the U.S. economy has been the world's
          largest since about 1890. It is the wealthiest country, with the highest
          disposable household income per capita among OECD members, though its wealth
          inequality is highly pronounced. Shaped by centuries of immigration, the culture
          of the U.S. is diverse and globally influential. Making up a third of global
          military spending, the country is widely considered to have the most powerful
          armed forces in the world and was the first to develop and employ nuclear
          weapons. A member of numerous international organizations including the United
          Nations Security Council, it plays a major role in global political, cultural,
          economic, and military affairs. Documented use of the phrase "United States of
          America" dates back to January 2, 1776. On that day, Stephen Moylan, a
          Continental Army aide to General George Washington, wrote a letter to Joseph
          Reed, Washington's aide-de-camp, seeking to go "with full and ample powers from
          the United States of America to Spain" to seek assistance in the Revolutionary
          War effort. The first known public usage is an anonymous essay published in the
          Williamsburg newspaper The Virginia Gazette on April 6, 1776. Sometime on or
          after June 11, 1776, Thomas Jefferson wrote "United States of America" in a
          rough draft of the Declaration of Independence, which was adopted by the Second
          Continental Congress on July 4, 1776. The term "United States" and its
          initialism "U.S.", used as nouns or as adjectives in English, are common short
          names for the country. The initialism "USA", a noun, is also common. "United
          States" and "U.S." are the established terms throughout the U.S. federal
          government, with prescribed rules. "The States" is an established colloquial
          shortening of the name, used particularly from abroad; "stateside" is the
          corresponding adjective or adverb. "America" is the feminine form of the first
          name of Americus Vesputius, the Latinized name of Italian explorer Amerigo
          Vespucci (1454–1512); It was first used as a place name by the German
          cartographers Martin Waldseemüller and Matthias Ringmann in 1507. Vespucci first
          proposed that the West Indies discovered by Christopher Columbus in 1492 were
          part of a previously unknown landmass and not among the Indies at the eastern
          limit of Asia. In English, the term "America" (used without a qualifier) seldom
          refers to topics unrelated to the United States. "The Americas" is the general
          term to describe the totality of the continents of North and South America. The
          first inhabitants of North America migrated from Siberia approximately 15,000
          years ago, either across the Bering land bridge or along the now-submerged Ice
          Age coastline. Small isolated groups of hunter-gatherers are said to have
          migrated alongside herds of large herbivores far into Alaska, with ice-free
          corridors developing along the Pacific coast and valleys of North America in c.
          16,500 – c. 13,500 BCE (c. 18,500 – c. 15,500 BP). The Clovis culture, which
          appeared around 11,000 BCE, is believed to be the first widespread culture in
          the Americas. Over time, Indigenous North American cultures grew increasingly
          sophisticated, and some, such as the Mississippian culture, developed
          agriculture, architecture, and complex societies. In the post-archaic period,
          the Mississippian cultures were located in the midwestern, eastern, and southern
          regions, and the Algonquian in the Great Lakes region and along the Eastern
          Seaboard, while the Hohokam culture and Ancestral Puebloans inhabited the
          Southwest. Native population estimates of what is now the United States before
          the arrival of European colonizers range from around 500,000 to nearly 10
          million. Christopher Columbus began exploring the Caribbean for Spain in 1492,
          leading to Spanish-speaking settlements and missions from what are now Puerto
          Rico and Florida to New Mexico and California. The first Spanish colony in the
          present-day continental United States was Spanish Florida, chartered in 1513.
          After several settlements failed there due to starvation and disease, Spain's
          first permanent town, Saint Augustine, was founded in 1565. France established
          its own settlements in French Florida in 1562, but they were either abandoned
          (Charlesfort, 1578) or destroyed by Spanish raids (Fort Caroline, 1565).
          Permanent French settlements were founded much later along the Great Lakes (Fort
          Detroit, 1701), the Mississippi River (St. Louis, 1764) and especially the Gulf
          of Mexico (New Orleans, 1718). Early European colonies also included the
          thriving Dutch colony of New Nederland (settled 1626, present-day New York) and
          the small Swedish colony of New Sweden (settled 1638 in what became Delaware).
          British colonization of the East Coast began with the Virginia Colony (1607) and
          the Plymouth Colony (Massachusetts, 1620). The Mayflower Compact in
          Massachusetts and the Fundamental Orders of Connecticut established precedents
          for local representative self-governance and constitutionalism that would
          develop throughout the American colonies. While European settlers in what is now
          the United States experienced conflicts with Native Americans, they also engaged
          in trade, exchanging European tools for food and animal pelts. Relations ranged
          from close cooperation to warfare and massacres. The colonial authorities often
          pursued policies that forced Native Americans to adopt European lifestyles,
          including conversion to Christianity. Along the eastern seaboard, settlers
          trafficked Africans through the Atlantic slave trade, largely to provide manual
          labor on plantations. The original Thirteen Colonies that would later found the
          United States were administered as possessions of the British Empire by
          Crown-appointed governors, though local governments held elections open to most
          white male property owners. The colonial population grew rapidly from Maine to
          Georgia, eclipsing Native American populations; by the 1770s, the natural
          increase of the population was such that only a small minority of Americans had
          been born overseas. The colonies' distance from Britain facilitated the
          entrenchment of self-governance, and the First Great Awakening, a series of
          Christian revivals, fueled colonial interest in guaranteed religious liberty.
          Following its victory in the French and Indian War, Britain began to assert
          greater control over local affairs in the Thirteen Colonies, resulting in
          growing political resistance. One of the primary grievances of the colonists was
          the denial of their rights as Englishmen, particularly the right to
          representation in the British government that taxed them. To demonstrate their
          dissatisfaction and resolve, the First Continental Congress met in 1774 and
          passed the Continental Association, a colonial boycott of British goods enforced
          by local "committees of safety" that proved effective. The British attempt to
          then disarm the colonists resulted in the 1775 Battles of Lexington and Concord,
          igniting the American Revolutionary War. At the Second Continental Congress, the
          colonies appointed George Washington commander-in-chief of the Continental Army,
          and created a committee that named Thomas Jefferson to draft the Declaration of
          Independence. Two days after the Second Continental Congress passed the Lee
          Resolution to create an independent, sovereign nation, the Declaration was
          adopted on July 4, 1776. The political values of the American Revolution evolved
          from an armed rebellion demanding reform within an empire to a revolution that
          created a new social and governing system founded on the defense of liberty and
          the protection of inalienable natural rights; sovereignty of the people;
          republicanism over monarchy, aristocracy, and other hereditary political power;
          civic virtue; and an intolerance of political corruption. The Founding Fathers
          of the United States, who included Washington, Jefferson, John Adams, Benjamin
          Franklin, Alexander Hamilton, John Jay, James Madison, Thomas Paine, and many
          others, were inspired by Classical, Renaissance, and Enlightenment philosophies
          and ideas. Though in practical effect since its drafting in 1777, the Articles
          of Confederation was ratified in 1781 and formally established a decentralized
          government that operated until 1789. After the British surrender at the siege of
          Yorktown in 1781, American sovereignty was internationally recognized by the
          Treaty of Paris (1783), through which the U.S. gained territory stretching west
          to the Mississippi River, north to present-day Canada, and south to Spanish
          Florida. The Northwest Ordinance (1787) established the precedent by which the
          country's territory would expand with the admission of new states, rather than
          the expansion of existing states. The U.S. Constitution was drafted at the 1787
          Constitutional Convention to overcome the limitations of the Articles. It went
          into effect in 1789, creating a federal republic governed by three separate
          branches that together formed a system of checks and balances. George Washington
          was elected the country's first president under the Constitution, and the Bill
          of Rights was adopted in 1791 to allay skeptics' concerns about the power of the
          more centralized government. His resignation as commander-in-chief after the
          Revolutionary War and his later refusal to run for a third term as the country's
          first president established a precedent for the supremacy of civil authority in
          the United States and the peaceful transfer of power. In the late 18th century,
          American settlers began to expand westward in larger numbers, many with a sense
          of manifest destiny. The Louisiana Purchase of 1803 from France nearly doubled
          the territory of the United States. Lingering issues with Britain remained,
          leading to the War of 1812, which was fought to a draw. Spain ceded Florida and
          its Gulf Coast territory in 1819. The Missouri Compromise of 1820, which
          admitted Missouri as a slave state and Maine as a free state, attempted to
          balance the desire of northern states to prevent the expansion of slavery into
          new territories with that of southern states to extend it there. Primarily, the
          compromise prohibited slavery in all other lands of the Louisiana Purchase north
          of the 36°30′ parallel. As Americans expanded further into territory inhabited
          by Native Americans, the federal government implemented policies of Indian
          removal or assimilation. The most significant such legislation was the Indian
          Removal Act of 1830, a key policy of President Andrew Jackson. It resulted in
          the Trail of Tears (1830–1850), in which an estimated 60,000 Native Americans
          living east of the Mississippi River were forcibly removed and displaced to
          lands far to the west, causing 13,200 to 16,700 deaths along the forced march.
          Settler expansion as well as this influx of Indigenous peoples from the East
          resulted in the American Indian Wars west of the Mississippi. During the
          colonial period, slavery became legal in all the Thirteen colonies, and by 1770
          it provided the main labor force in the large-scale, agriculture-dependent
          economies of the Southern Colonies from Maryland to Georgia. The practice began
          to be significantly questioned during the American Revolution, and spurred by an
          active abolitionist movement that had reemerged in the 1830s, states in the
          North enacted laws to prohibit slavery within their boundaries. At the same
          time, support for slavery had strengthened in Southern states, with widespread
          use of inventions such as the cotton gin (1793) having made slavery immensely
          profitable for Southern elites. The United States annexed the Republic of Texas
          in 1845, and the 1846 Oregon Treaty led to U.S. control of the present-day
          American Northwest. Dispute with Mexico over Texas led to the Mexican–American
          War (1846–1848). After the victory of the U.S., Mexico recognized U.S.
          sovereignty over Texas, New Mexico, and California in the 1848 Mexican Cession;
          the cession's lands also included the future states of Nevada, Colorado and
          Utah. The California gold rush of 1848–1849 spurred a huge migration of white
          settlers to the Pacific coast, leading to even more confrontations with Native
          populations. One of the most violent, the California genocide of thousands of
          Native inhabitants, lasted into the mid-1870s. Additional western territories
          and states were created. Throughout the 1850s, the sectional conflict regarding
          slavery was further inflamed by national legislation in the U.S. Congress and
          decisions of the Supreme Court. In Congress, the Fugitive Slave Act of 1850
          mandated the forcible return to their owners in the South of slaves taking
          refuge in non-slave states, while the Kansas–Nebraska Act of 1854 effectively
          gutted the anti-slavery requirements of the Missouri Compromise. In its Dred
          Scott decision of 1857, the Supreme Court ruled against a slave brought into
          non-slave territory, simultaneously declaring the entire Missouri Compromise to
          be unconstitutional. These and other events exacerbated tensions between North
          and South that would culminate in the American Civil War (1861–1865). Beginning
          with South Carolina, 11 slave-state governments voted to secede from the United
          States in 1861, joining to create the Confederate States of America. All other
          state governments remained loyal to the Union. War broke out in April 1861 after
          the Confederacy bombarded Fort Sumter. Following the Emancipation Proclamation
          on January 1, 1863, many freed slaves joined the Union army. The war began to
          turn in the Union's favor following the 1863 Siege of Vicksburg and Battle of
          Gettysburg, and the Confederates surrendered in 1865 after the Union's victory
          in the Battle of Appomattox Court House. Efforts toward reconstruction in the
          secessionist South had begun as early as 1862, but it was only after President
          Lincoln's assassination that the three Reconstruction Amendments to the
          Constitution were ratified to protect civil rights. The amendments codified
          nationally the abolition of slavery and involuntary servitude except as
          punishment for crimes, promised equal protection under the law for all persons,
          and prohibited discrimination on the basis of race or previous enslavement. As a
          result, African Americans took an active political role in ex-Confederate states
          in the decade following the Civil War. The former Confederate states were
          readmitted to the Union, beginning with Tennessee in 1866 and ending with
          Georgia in 1870. National infrastructure, including transcontinental telegraph
          and railroads, spurred growth in the American frontier. This was accelerated by
          the Homestead Acts, through which nearly 10 percent of the total land area of
          the United States was given away free to some 1.6 million homesteaders. From
          1865 through 1917, an unprecedented stream of immigrants arrived in the United
          States, including 24.4 million from Europe. Most came through the Port of New
          York, as New York City and other large cities on the East Coast became home to
          large Jewish, Irish, and Italian populations. Many Northern Europeans as well as
          significant numbers of Germans and other Central Europeans moved to the Midwest.
          At the same time, about one million French Canadians migrated from Quebec to New
          England. During the Great Migration, millions of African Americans left the
          rural South for urban areas in the North. Alaska was purchased from Russia in
          1867. The Compromise of 1877 is generally considered the end of the
          Reconstruction era, as it resolved the electoral crisis following the 1876
          presidential election and led President Rutherford B. Hayes to reduce the role
          of federal troops in the South. Immediately, the Redeemers began evicting the
          Carpetbaggers and quickly regained local control of Southern politics in the
          name of white supremacy. African Americans endured a period of heightened, overt
          racism following Reconstruction, a time often considered the nadir of American
          race relations. A series of Supreme Court decisions, including Plessy v.
          Ferguson, emptied the Fourteenth and Fifteenth Amendments of their force,
          allowing Jim Crow laws in the South to remain unchecked, sundown towns in the
          Midwest, and segregation in communities across the country, which would be
          reinforced in part by the policy of redlining later adopted by the federal Home
          Owners' Loan Corporation. An explosion of technological advancement, accompanied
          by the exploitation of cheap immigrant labor, led to rapid economic expansion
          during the Gilded Age of the late 19th century. It continued into the early
          20th, when the United States already outpaced the economies of Britain, France,
          and Germany combined. Tycoons

          The United States of America (USA), also known as the United States (U.S.) or
          America, is a country primarily located in North America. It is a federal
          republic consisting of 50 states and a federal capital district, Washington,
          D.C. The 48 contiguous states border Canada to the north and Mexico to the
          south, with the semi-exclave of Alaska in the northwest and the archipelago of
          Hawaii in the Pacific Ocean. The United States also asserts sovereignty over
          five major island territories and various uninhabited islands in Oceania and the
          Caribbean. It is a megadiverse country, with the world's third-largest land area
          and third-largest population, exceeding 341 million. Paleo-Indians first
          migrated from North Asia to North America at least 15,000 years ago, and formed
          various civilizations. European discovery of the Americas began in 1492, and
          British colonization followed with the 1607 settlement of Virginia, the first of
          the Thirteen Colonies. The American Enlightenment that spread throughout the
          colonies in the 18th century valued republicanism and liberalism. Clashes with
          the British Crown over taxation without parliamentary representation and the
          denial of other English rights evolved into the American Revolution, which led
          to the Declaration of Independence on July 4, 1776. Victory in the 1775–1783
          Revolutionary War brought international recognition of the country's
          sovereignty. Rapid westward territorial expansion followed the purchase,
          settlement, and conquest of European-held or Indigenous-controlled territory. As
          more states were admitted into the Union, a North–South division over slavery
          led 11 Southern states to declare secession and join as the Confederate States
          of America in order to preserve slavery there. These states fought against the
          Union in the American Civil War of 1861–1865 but were defeated. With the United
          States' victory and reunification, slavery was abolished nationally. By 1900,
          the country had established itself as a great power, a status solidified after
          its involvement during World War I. Following Japan's attack on Pearl Harbor in
          1941, the U.S. entered World War II on the side of the Allies. Its aftermath
          left the U.S. and the Soviet Union as rival superpowers, competing for
          ideological dominance and international influence during the Cold War. The
          Soviet Union's collapse in 1991 left the U.S. the world's sole superpower until
          the early 2020s, when China began to be viewed as a rival superpower. The U.S.
          federal government is a representative democracy with a president and a
          constitution that creates a separation of powers among three branches:
          legislative, executive, and judicial. The United States Congress is a bicameral
          national legislature composed of the House of Representatives (a lower house
          based on population) and the Senate (an upper house based on equal
          representation for each state). Federalism grants substantial autonomy to the 50
          states. In addition, 574 Native American tribes have sovereignty rights, and
          there are 326 Native American reservations. A developed country, the U.S. ranks
          high in economic competitiveness, innovation, and higher education. Accounting
          for over a quarter of nominal global GDP, the U.S. economy has been the world's
          largest since about 1890. It is the wealthiest country, with the highest
          disposable household income per capita among OECD members, though its wealth
          inequality is highly pronounced. Shaped by centuries of immigration, the culture
          of the U.S. is diverse and globally influential. Making up a third of global
          military spending, the country is widely considered to have the most powerful
          armed forces in the world and was the first to develop and employ nuclear
          weapons. A member of numerous international organizations including the United
          Nations Security Council, it plays a major role in global political, cultural,
          economic, and military affairs. Documented use of the phrase "United States of
          America" dates back to January 2, 1776. On that day, Stephen Moylan, a
          Continental Army aide to General George Washington, wrote a letter to Joseph
          Reed, Washington's aide-de-camp, seeking to go "with full and ample powers from
          the United States of America to Spain" to seek assistance in the Revolutionary
          War effort. The first known public usage is an anonymous essay published in the
          Williamsburg newspaper The Virginia Gazette on April 6, 1776. Sometime on or
          after June 11, 1776, Thomas Jefferson wrote "United States of America" in a
          rough draft of the Declaration of Independence, which was adopted by the Second
          Continental Congress on July 4, 1776. The term "United States" and its
          initialism "U.S.", used as nouns or as adjectives in English, are common short
          names for the country. The initialism "USA", a noun, is also common. "United
          States" and "U.S." are the established terms throughout the U.S. federal
          government, with prescribed rules. "The States" is an established colloquial
          shortening of the name, used particularly from abroad; "stateside" is the
          corresponding adjective or adverb. "America" is the feminine form of the first
          name of Americus Vesputius, the Latinized name of Italian explorer Amerigo
          Vespucci (1454–1512); It was first used as a place name by the German
          cartographers Martin Waldseemüller and Matthias Ringmann in 1507. Vespucci first
          proposed that the West Indies discovered by Christopher Columbus in 1492 were
          part of a previously unknown landmass and not among the Indies at the eastern
          limit of Asia. In English, the term "America" (used without a qualifier) seldom
          refers to topics unrelated to the United States. "The Americas" is the general
          term to describe the totality of the continents of North and South America. The
          first inhabitants of North America migrated from Siberia approximately 15,000
          years ago, either across the Bering land bridge or along the now-submerged Ice
          Age coastline. Small isolated groups of hunter-gatherers are said to have
          migrated alongside herds of large herbivores far into Alaska, with ice-free
          corridors developing along the Pacific coast and valleys of North America in c.
          16,500 – c. 13,500 BCE (c. 18,500 – c. 15,500 BP). The Clovis culture, which
          appeared around 11,000 BCE, is believed to be the first widespread culture in
          the Americas. Over time, Indigenous North American cultures grew increasingly
          sophisticated, and some, such as the Mississippian culture, developed
          agriculture, architecture, and complex societies. In the post-archaic period,
          the Mississippian cultures were located in the midwestern, eastern, and southern
          regions, and the Algonquian in the Great Lakes region and along the Eastern
          Seaboard, while the Hohokam culture and Ancestral Puebloans inhabited the
          Southwest. Native population estimates of what is now the United States before
          the arrival of European colonizers range from around 500,000 to nearly 10
          million. Christopher Columbus began exploring the Caribbean for Spain in 1492,
          leading to Spanish-speaking settlements and missions from what are now Puerto
          Rico and Florida to New Mexico and California. The first Spanish colony in the
          present-day continental United States was Spanish Florida, chartered in 1513.
          After several settlements failed there due to starvation and disease, Spain's
          first permanent town, Saint Augustine, was founded in 1565. France established
          its own settlements in French Florida in 1562, but they were either abandoned
          (Charlesfort, 1578) or destroyed by Spanish raids (Fort Caroline, 1565).
          Permanent French settlements were founded much later along the Great Lakes (Fort
          Detroit, 1701), the Mississippi River (St. Louis, 1764) and especially the Gulf
          of Mexico (New Orleans, 1718). Early European colonies also included the
          thriving Dutch colony of New Nederland (settled 1626, present-day New York) and
          the small Swedish colony of New Sweden (settled 1638 in what became Delaware).
          British colonization of the East Coast began with the Virginia Colony (1607) and
          the Plymouth Colony (Massachusetts, 1620). The Mayflower Compact in
          Massachusetts and the Fundamental Orders of Connecticut established precedents
          for local representative self-governance and constitutionalism that would
          develop throughout the American colonies. While European settlers in what is now
          the United States experienced conflicts with Native Americans, they also engaged
          in trade, exchanging European tools for food and animal pelts. Relations ranged
          from close cooperation to warfare and massacres. The colonial authorities often
          pursued policies that forced Native Americans to adopt European lifestyles,
          including conversion to Christianity. Along the eastern seaboard, settlers
          trafficked Africans through the Atlantic slave trade, largely to provide manual
          labor on plantations. The original Thirteen Colonies that would later found the
          United States were administered as possessions of the British Empire by
          Crown-appointed governors, though local governments held elections open to most
          white male property owners. The colonial population grew rapidly from Maine to
          Georgia, eclipsing Native American populations; by the 1770s, the natural
          increase of the population was such that only a small minority of Americans had
          been born overseas. The colonies' distance from Britain facilitated the
          entrenchment of self-governance, and the First Great Awakening, a series of
          Christian revivals, fueled colonial interest in guaranteed religious liberty.
          Following its victory in the French and Indian War, Britain began to assert
          greater control over local affairs in the Thirteen Colonies, resulting in
          growing political resistance. One of the primary grievances of the colonists was
          the denial of their rights as Englishmen, particularly the right to
          representation in the British government that taxed them. To demonstrate their
          dissatisfaction and resolve, the First Continental Congress met in 1774 and
          passed the Continental Association, a colonial boycott of British goods enforced
          by local "committees of safety" that proved effective. The British attempt to
          then disarm the colonists resulted in the 1775 Battles of Lexington and Concord,
          igniting the American Revolutionary War. At the Second Continental Congress, the
          colonies appointed George Washington commander-in-chief of the Continental Army,
          and created a committee that named Thomas Jefferson to draft the Declaration of
          Independence. Two days after the Second Continental Congress passed the Lee
          Resolution to create an independent, sovereign nation, the Declaration was
          adopted on July 4, 1776. The political values of the American Revolution evolved
          from an armed rebellion demanding reform within an empire to a revolution that
          created a new social and governing system founded on the defense of liberty and
          the protection of inalienable natural rights; sovereignty of the people;
          republicanism over monarchy, aristocracy, and other hereditary political power;
          civic virtue; and an intolerance of political corruption. The Founding Fathers
          of the United States, who included Washington, Jefferson, John Adams, Benjamin
          Franklin, Alexander Hamilton, John Jay, James Madison, Thomas Paine, and many
          others, were inspired by Classical, Renaissance, and Enlightenment philosophies
          and ideas. Though in practical effect since its drafting in 1777, the Articles
          of Confederation was ratified in 1781 and formally established a decentralized
          government that operated until 1789. After the British surrender at the siege of
          Yorktown in 1781, American sovereignty was internationally recognized by the
          Treaty of Paris (1783), through which the U.S. gained territory stretching west
          to the Mississippi River, north to present-day Canada, and south to Spanish
          Florida. The Northwest Ordinance (1787) established the precedent by which the
          country's territory would expand with the admission of new states, rather than
          the expansion of existing states. The U.S. Constitution was drafted at the 1787
          Constitutional Convention to overcome the limitations of the Articles. It went
          into effect in 1789, creating a federal republic governed by three separate
          branches that together formed a system of checks and balances. George Washington
          was elected the country's first president under the Constitution, and the Bill
          of Rights was adopted in 1791 to allay skeptics' concerns about the power of the
          more centralized government. His resignation as commander-in-chief after the
          Revolutionary War and his later refusal to run for a third term as the country's
          first president established a precedent for the supremacy of civil authority in
          the United States and the peaceful transfer of power. In the late 18th century,
          American settlers began to expand westward in larger numbers, many with a sense
          of manifest destiny. The Louisiana Purchase of 1803 from France nearly doubled
          the territory of the United States. Lingering issues with Britain remained,
          leading to the War of 1812, which was fought to a draw. Spain ceded Florida and
          its Gulf Coast territory in 1819. The Missouri Compromise of 1820, which
          admitted Missouri as a slave state and Maine as a free state, attempted to
          balance the desire of northern states to prevent the expansion of slavery into
          new territories with that of southern states to extend it there. Primarily, the
          compromise prohibited slavery in all other lands of the Louisiana Purchase north
          of the 36°30′ parallel. As Americans expanded further into territory inhabited
          by Native Americans, the federal government implemented policies of Indian
          removal or assimilation. The most significant such legislation was the Indian
          Removal Act of 1830, a key policy of President Andrew Jackson. It resulted in
          the Trail of Tears (1830–1850), in which an estimated 60,000 Native Americans
          living east of the Mississippi River were forcibly removed and displaced to
          lands far to the west, causing 13,200 to 16,700 deaths along the forced march.
          Settler expansion as well as this influx of Indigenous peoples from the East
          resulted in the American Indian Wars west of the Mississippi. During the
          colonial period, slavery became legal in all the Thirteen colonies, and by 1770
          it provided the main labor force in the large-scale, agriculture-dependent
          economies of the Southern Colonies from Maryland to Georgia. The practice began
          to be significantly questioned during the American Revolution, and spurred by an
          active abolitionist movement that had reemerged in the 1830s, states in the
          North enacted laws to prohibit slavery within their boundaries. At the same
          time, support for slavery had strengthened in Southern states, with widespread
          use of inventions such as the cotton gin (1793) having made slavery immensely
          profitable for Southern elites. The United States annexed the Republic of Texas
          in 1845, and the 1846 Oregon Treaty led to U.S. control of the present-day
          American Northwest. Dispute with Mexico over Texas led to the Mexican–American
          War (1846–1848). After the victory of the U.S., Mexico recognized U.S.
          sovereignty over Texas, New Mexico, and California in the 1848 Mexican Cession;
          the cession's lands also included the future states of Nevada, Colorado and
          Utah. The California gold rush of 1848–1849 spurred a huge migration of white
          settlers to the Pacific coast, leading to even more confrontations with Native
          populations. One of the most violent, the California genocide of thousands of
          Native inhabitants, lasted into the mid-1870s. Additional western territories
          and states were created. Throughout the 1850s, the sectional conflict regarding
          slavery was further inflamed by national legislation in the U.S. Congress and
          decisions of the Supreme Court. In Congress, the Fugitive Slave Act of 1850
          mandated the forcible return to their owners in the South of slaves taking
          refuge in non-slave states, while the Kansas–Nebraska Act of 1854 effectively
          gutted the anti-slavery requirements of the Missouri Compromise. In its Dred
          Scott decision of 1857, the Supreme Court ruled against a slave brought into
          non-slave territory, simultaneously declaring the entire Missouri Compromise to
          be unconstitutional. These and other events exacerbated tensions between North
          and South that would culminate in the American Civil War (1861–1865). Beginning
          with South Carolina, 11 slave-state governments voted to secede from the United
          States in 1861, joining to create the Confederate States of America. All other
          state governments remained loyal to the Union. War broke out in April 1861 after
          the Confederacy bombarded Fort Sumter. Following the Emancipation Proclamation
          on January 1, 1863, many freed slaves joined the Union army. The war began to
          turn in the Union's favor following the 1863 Siege of Vicksburg and Battle of
          Gettysburg, and the Confederates surrendered in 1865 after the Union's victory
          in the Battle of Appomattox Court House. Efforts toward reconstruction in the
          secessionist South had begun as early as 1862, but it was only after President
          Lincoln's assassination that the three Reconstruction Amendments to the
          Constitution were ratified to protect civil rights. The amendments codified
          nationally the abolition of slavery and involuntary servitude except as
          punishment for crimes, promised equal protection under the law for all persons,
          and prohibited discrimination on the basis of race or previous enslavement. As a
          result, African Americans took an active political role in ex-Confederate states
          in the decade following the Civil War. The former Confederate states were
          readmitted to the Union, beginning with Tennessee in 1866 and ending with
          Georgia in 1870. National infrastructure, including transcontinental telegraph
          and railroads, spurred growth in the American frontier. This was accelerated by
          the Homestead Acts, through which nearly 10 percent of the total land area of
          the United States was given away free to some 1.6 million homesteaders. From
          1865 through 1917, an unprecedented stream of immigrants arrived in the United
          States, including 24.4 million from Europe. Most came through the Port of New
          York, as New York City and other large cities on the East Coast became home to
          large Jewish, Irish, and Italian populations. Many Northern Europeans as well as
          significant numbers of Germans and other Central Europeans moved to the Midwest.
          At the same time, about one million French Canadians migrated from Quebec to New
          England. During the Great Migration, millions of African Americans left the
          rural South for urban areas in the North. Alaska was purchased from Russia in
          1867. The Compromise of 1877 is generally considered the end of the
          Reconstruction era, as it resolved the electoral crisis following the 1876
          presidential election and led President Rutherford B. Hayes to reduce the role
          of federal troops in the South. Immediately, the Redeemers began evicting the
          Carpetbaggers and quickly regained local control of Southern politics in the
          name of white supremacy. African Americans endured a period of heightened, overt
          racism following Reconstruction, a time often considered the nadir of American
          race relations. A series of Supreme Court decisions, including Plessy v.
          Ferguson, emptied the Fourteenth and Fifteenth Amendments of their force,
          allowing Jim Crow laws in the South to remain unchecked, sundown towns in the
          Midwest, and segregation in communities across the country, which would be
          reinforced in part by the policy of redlining later adopted by the federal Home
          Owners' Loan Corporation. An explosion of technological advancement, accompanied
          by the exploitation of cheap immigrant labor, led to rapid economic expansion
          during the Gilded Age of the late 19th century. It continued into the early
          20th, when the United States already outpaced the economies of Britain, France,
          and Germany combined. Tycoons led the nation's expansion in the railroad,
          petroleum, and steel industries, as the United States emerged as a pioneer of
          the automotive industry. This fostered the amassing of enormous economic and
          political power by a few prominent industrialists, largely through the formation
          of trusts and monopolies to prevent competition. These changes resulted in
          significant increases in economic inequality, slum conditions, and social
          unrest, creating a fertile environment for labor unions to flourish and, to a
          more limited extent, socialist movements. This period eventually ended with the
          advent of the Progressive Era, which was characterized by significant economic,
          legislative and social reforms. Pro-American elements in Hawaii overthrew the
          Hawaiian monarchy; the islands were annexed in 1898. That same year, Puerto
          Rico, the Philippines, and Guam were ceded to the U.S. by Spain after the
          latter's defeat in the Spanish–American War. (The Philippines was granted full
          independence from the U.S. on July 4, 1946, following World War II. Puerto Rico
          and Guam have remained U.S. territories.) American Samoa was acquired by the
          United States in 1900 after the Second Samoan Civil War. The U.S. Virgin Islands
          were purchased from Denmark in 1917 after Danish voters approved the sale in a
          1916 referendum. The United States entered World War I alongside the Allies in
          1917 helping to turn the tide against the Central Powers. In 1920, a
          constitutional amendment granted nationwide women's suffrage. During the 1920s
          and 1930s, radio for mass communication and early television transformed
          communications nationwide. The Wall Street Crash of 1929 triggered the Great
          Depression, to which President Franklin D. Roosevelt responded with the New Deal
          plan of "reform, recovery and relief", a series of unprecedented and sweeping
          recovery programs and employment relief projects combined with financial reforms
          and regulations. Initially neutral during World War II, the U.S. began supplying
          war materiel to the Allies of World War II in March 1941 and entered the war in
          December after Japan's attack on Pearl Harbor. Agreeing to a "Europe first"
          policy, the U.S. concentrated its wartime efforts on Japan's allies Italy and
          Germany until their final defeat in May 1945. The U.S. developed the first
          nuclear weapons and used them against the Japanese cities of Hiroshima and
          Nagasaki in August 1945, ending the war. The United States was one of the "Four
          Policemen" who met to plan the post-war world, alongside the United Kingdom, the
          Soviet Union, and China. The U.S. emerged relatively unscathed from the war,
          with even greater economic power and international political influence. The end
          of World War II in 1945 left the U.S. and the Soviet Union as superpowers, each
          with its own political, military, and economic sphere of influence. Geopolitical
          tensions between the two superpowers soon led to the Cold War. The U.S.
          implemented a policy of containment intended to limit the Soviet Union's sphere
          of influence; engaged in regime change against governments perceived to be
          aligned with the Soviets; and prevailed in the Space Race, which culminated with
          the first crewed Moon landing in 1969. Domestically, the U.S. experienced
          economic growth, urbanization, and population growth following World War II. The
          civil rights movement emerged, with Martin Luther King Jr. becoming a prominent
          leader in the early 1960s. The Great Society plan of President Lyndon B.
          Johnson's administration resulted in groundbreaking and broad-reaching laws,
          policies and a constitutional amendment to counteract some of the worst effects
          of lingering institutional racism. The counterculture movement in the U.S.
          brought significant social changes, including the liberalization of attitudes
          toward recreational drug use and sexuality. It also encouraged open defiance of
          the military draft (leading to the end of conscription in 1973) and wide
          opposition to U.S. intervention in Vietnam, with the U.S. totally withdrawing in
          1975. A societal shift in the roles of women was significantly responsible for
          the large increase in female paid labor participation starting in the 1970s, and
          by 1985 the majority of American women aged 16 and older were employed. The Fall
          of Communism and the dissolution of the Soviet Union from 1989 to 1991 marked
          the end of the Cold War and left the United States as the world's sole
          superpower. This cemented the United States' global influence, reinforcing the
          concept of the "American Century" as the U.S. dominated international political,
          cultural, economic, and military affairs. The 1990s saw the longest recorded
          economic expansion in American history, a dramatic decline in U.S. crime rates,
          and advances in technology. Throughout this decade, technological innovations
          such as the World Wide Web, the evolution of the Pentium microprocessor in
          accordance with Moore's law, rechargeable lithium-ion batteries, the first gene
          therapy trial, and cloning either emerged in the U.S. or were improved upon
          there. The Human Genome Project was formally launched in 1990, while Nasdaq
          became the first stock market in the United States to trade online in 1998. In
          the Gulf War of 1991, an American-led international coalition of states expelled
          an Iraqi invasion force that had occupied neighboring Kuwait. The September 11
          attacks on the United States in 2001 by the pan-Islamist militant organization
          al-Qaeda led to the war on terror and subsequent military interventions in
          Afghanistan and in Iraq. The U.S. housing bubble culminated in 2007 with the
          Great Recession, the largest economic contraction since the Great Depression.
          Beginning in the 2010s, and particularly in the 2020s, the United States has
          experienced increased political polarization and significant democratic
          backsliding. The country's polarization was violently reflected in the January
          2021 Capitol attack, when a mob of insurrectionists entered the U.S. Capitol and
          sought to prevent the peaceful transfer of power in an attempted self-coup
          d'état. The United States is the world's third-largest country by total area
          behind Russia and Canada. The 48 contiguous states and the District of Columbia
          have a combined area of 3,119,885 square miles (8,080,470 km2). In 2021, the
          United States had 8% of the Earth's permanent meadows and pastures and 10% of
          its cropland. Starting in the east, the coastal plain of the Atlantic seaboard
          gives way to inland forests and rolling hills in the Piedmont plateau region.
          The Appalachian Mountains and the Adirondack Massif separate the East Coast from
          the Great Lakes and the grasslands of the Midwest. The Mississippi River System,
          the world's fourth-longest river system, runs predominantly north–south through
          the center of the country. The flat and fertile prairie of the Great Plains
          stretches to the west, interrupted by a highland region in the southeast. The
          Rocky Mountains, west of the Great Plains, extend north to south across the
          country, peaking at over 14,000 feet (4,300 m) in Colorado. The supervolcano
          underlying Yellowstone National Park in the Rocky Mountains, the Yellowstone
          Caldera, is the continent's largest volcanic feature. Farther west are the rocky
          Great Basin and the Chihuahuan, Sonoran, and Mojave deserts. In the northwest
          corner of Arizona, carved by the Colorado River, is the Grand Canyon, a
          steep-sided canyon and popular tourist destination known for its overwhelming
          visual size and intricate, colorful landscape. The Cascade and Sierra Nevada
          mountain ranges run close to the Pacific coast. The lowest and highest points in
          the contiguous United States are in the State of California, about 84 miles (135
          km) apart. At an elevation of 20,310 feet (6,190.5 m), Alaska's Denali (also
          called Mount McKinley) is the highest peak in the country and on the continent.
          Active volcanoes in the U.S. are common throughout Alaska's Alexander and
          Aleutian Islands. Located entirely outside North America, the archipelago of
          Hawaii consists of volcanic islands, physiographically and ethnologically part
          of the Polynesian subregion of Oceania. In addition to its total land area, the
          United States has one of the world's largest marine exclusive economic zones
          spanning approximately 4.5 million square miles (11.7 million km2) of ocean.
          With its large size and geographic variety, the United States includes most
          climate types. East of the 100th meridian, the climate ranges from humid
          continental in the north to humid subtropical in the south. The western Great
          Plains are semi-arid. Many mountainous areas of the American West have an alpine
          climate. The climate is arid in the Southwest, Mediterranean in coastal
          California, and oceanic in coastal Oregon, Washington, and southern Alaska. Most
          of Alaska is subarctic or polar. Hawaii, the southern tip of Florida and U.S.
          territories in the Caribbean and Pacific are tropical. The United States
          receives more high-impact extreme weather incidents than any other country.
          States bordering the Gulf of Mexico are prone to hurricanes, and most of the
          world's tornadoes occur in the country, mainly in Tornado Alley. Due to climate
          change in the country, extreme weather has become more frequent in the U.S. in
          the 21st century, with three times the number of reported heat waves compared to
          the 1960s. Since the 1990s, droughts in the American Southwest have become more
          persistent and more severe. The regions considered as the most attractive to the
          population are the most vulnerable. The U.S. is one of 17 megadiverse countries
          containing large numbers of endemic species: about 17,000 species of vascular
          plants occur in the contiguous United States and Alaska, and over 1,800 species
          of flowering plants are found in Hawaii, few of which occur on the mainland. The
          United States is home to 428 mammal species, 784 birds, 311 reptiles, 295
          amphibians, and around 91,000 insect species. There are 63 national parks, and
          hundreds of other federally managed monuments, forests, and wilderness areas,
          administered by the National Park Service and other agencies. About 28% of the
          country's land is publicly owned and federally managed, primarily in the Western
          States. Most of this land is protected, though some is leased for commercial
          use, and less than one percent is used for military purposes. Environmental
          issues in the United States include debates on non-renewable resources and
          nuclear energy, air and water pollution, biodiversity, logging and
          deforestation, and climate change. The U.S. Environmental Protection Agency
          (EPA) is the federal agency charged with addressing most environmental-related
          issues. The idea of wilderness has shaped the management of public lands since
          1964, with the Wilderness Act. The Endangered Species Act of 1973 provides a way
          to protect threatened and endangered species and their habitats. The United
          States Fish and Wildlife Service implements and enforces the Act. In 2024, the
          U.S. ranked 35th among 180 countries in the Environmental Performance Index. The
          United States is a federal republic consisting of 50 states and a federal
          capital district, Washington, D.C. The U.S. asserts sovereignty over five
          unincorporated territories and several uninhabited island possessions. It is the
          world's oldest surviving federation, and its presidential system of federal
          government has been adopted, in whole or in part, by many newly independent
          states worldwide following their decolonization. The Constitution of the United
          States serves as the country's supreme legal document. The United States was the
          most prominent liberal democracy for much of the 20th and early 21st centuries,
          but has undergone significant democratic backsliding and a shift toward a hybrid
          regime—a political system combining autocratic and democratic features. There is
          an ongoing debate among political scientists on whether the country is more
          appropriately classified as an electoral autocracy or illiberal democracy, with
          few still considering it a robust liberal democracy. Composed of three branches,
          all headquartered in Washington, D.C., the federal government is the national
          government of the United States. The U.S. Constitution establishes a separation
          of powers intended to provide a system of checks and balances to prevent any of
          the three branches from becoming supreme. The U.S. Congress is a bicameral
          legislature made up of the Senate and the House of Representatives. The Senate
          has 100 members—two residents from each state and elected by that state's voters
          for a six-year term. The House of Representatives has 435 members, elected for a
          two-year term by the constituency of the congressional district where they
          reside. A state's legislature decides the district boundaries, which are
          contiguous within the state. Every U.S. congressional district is of equivalent
          population and sends one representative to Congress. Election years for senators
          are staggered so that only one-third of them will be up for election every two
          years. U.S. representatives are all up for election at the same time every two
          years. The U.S. Congress makes federal law, declares war, approves treaties, has
          the power of the purse, and has the power of impeachment. One of its foremost
          non-legislative functions is the power to investigate and oversee the executive
          branch. Congressional oversight is usually delegated to committees and is
          facilitated by Congress' power to issue subpoenas. Much of the work of Congress
          is performed by a collection of committees, each appointed for a specific
          purpose or function. Committee membership is by tradition and statute
          bipartisan, but all committees are chaired by a member of the majority party,
          who sets the committee agenda. The U.S. president is the head of state,
          commander-in-chief of the military, and chief executive of the federal
          government. The president appoints the members of the Cabinet, subject to Senate
          approval, and names other officials who administer and enforce federal law and
          policy through their respective agencies. The president has the ability to veto
          legislative bills from the U.S. Congress before they become law. However,
          presidential vetoes can be overridden by a two-thirds supermajority vote in both
          chambers of Congress. The president also has clemency power for federal crimes
          and can issue pardons. Finally, the president has the authority to issue
          expansive "executive orders" in a number of policy areas, subject to judicial
          review. Candidates for president campaign with a vice-presidential running mate.
          Both candidates are elected together, or defeated together, in a presidential
          election. Unlike other votes in American politics, this is technically an
          indirect election in which the winner will be determined by the U.S. Electoral
          College. There, votes are officially cast by individual electors selected by
          their state legislature. In practice, however, each of the 50 states chooses a
          group of presidential electors who are required by state law to confirm the
          winner of their state's popular vote. Each state is allocated two electors plus
          one additional elector for every congressional district in the state, which in
          effect combines to equal the number of elected officials that state sends to
          Congress. The District of Columbia, with no representatives or senators, is
          allocated three electoral votes. Both the president and the vice president serve
          a four-year term, and the president may be reelected to the office only once,
          for one additional four-year term. The U.S. federal judiciary, whose judges are
          all appointed for life by the president with Senate approval, consists primarily
          of the U.S. Supreme Court, the U.S. courts of appeals, and the U.S. district
          courts. The lowest level in the federal judiciary is the federal district court,
          which decides all cases considered to be under "original jurisdiction", such as
          federal statutes, constitutional law, or international treaties. After a federal
          district court has decided a case, its ruling may be contested and sent to a
          higher court, a federal court of appeals. The U.S. judicial system's 12 federal
          circuits divide the country into 12 separate geographic administrative regions
          for appeals decisions. The next and highest court in the system is the Supreme
          Court of the United States. The U.S. Supreme Court interprets laws and overturns
          those it finds unconstitutional. On average, the Supreme Court receives about
          7,000 appeals petitions for writs of certiorari each year, but only grants about
          80. Consisting of nine members led by the Chief Justice of the United States,
          the court judges each case before it by majority decision. In the case of a
          presidential impeachment trial in the Senate, the chief justice presides. As
          with all other federal judges, the members are appointed for life by the sitting
          president with Senate approval when a vacancy becomes available. The
          three-branch system is known as the presidential system, in contrast to the
          parliamentary system where the executive is part of the legislative body. Many
          countries around the world adopted this aspect of the 1789 Constitution of the
          United States, especially in the postcolonial Americas. In the U.S. federal
          system, sovereign powers are shared between three levels of government specified
          in the Constitution: the federal government, the states, and Indian tribes. The
          U.S. also asserts sovereignty over five permanently inhabited territories:
          American Samoa, Guam, the Northern Mariana Islands, Puerto Rico, and the U.S.
          Virgin Islands. Residents of the 50 states are governed by their elected state
          government, under state constitutions compatible with the national constitution,
          and by elected local governments that are administrative divisions of a state.
          States are subdivided into counties or county equivalents, which (except in
          Hawaii) can permit the formation of independent municipalities administered by
          their own elected representatives. The District of Columbia is a federal
          district containing the U.S. capital, Washington, D.C. The federal district is
          an administrative division of the federal government. Indian country is made up
          of 574 federally recognized tribes and 326 Indian reservations. They hold a
          government-to-government relationship with the U.S. federal government in
          Washington and are legally defined as domestic dependent nations with inherent
          tribal sovereignty rights. In addition to the five major territories, the U.S.
          also asserts sovereignty over the United States Minor Outlying Islands in the
          Pacific Ocean and the Caribbean. The seven undisputed islands without permanent
          populations are Baker Island, Howland Island, Jarvis Island, Johnston Atoll,
          Kingman Reef, Midway Atoll, and Palmyra Atoll. U.S. sovereignty over the
          unpopulated Bajo Nuevo Bank, Navassa Island, Serranilla Bank, and Wake Island is
          disputed. The Constitution is silent on political parties. However, they
          developed independently in the 18th century with the Federalist and
          Anti-Federalist parties. Since then, the United States has operated as a de
          facto two-party system, though the parties have changed over time. Since the
          mid-19th century, the two main national parties have been the Democratic Party
          and the Republican Party. Political scientists classify the Democratic Party as
          a liberal party whose political platform stands near the ideological center, and
          the Republicans as a right-wing populist and nationalist party. The United
          States has an established structure of foreign relations, with the world's
          second-largest diplomatic corps as of 2024. It is a permanent member of the
          United Nations Security Council and home to the United Nations headquarters. The
          United States is a member of the G7, G20, and OECD intergovernmental
          organizations. Almost all countries have embassies and many have consulates
          (official representatives) in the country. Likewise, nearly all countries host
          formal diplomatic missions with the United States, except Iran, North Korea, and
          Bhutan. Though Taiwan does not have formal diplomatic relations with the U.S.,
          it maintains close unofficial relations. The United States regularly supplies
          Taiwan with military equipment to deter potential Chinese aggression. The United
          States has a "Special Relationship" with the United Kingdom and strong ties with
          Canada, Australia, New Zealand, the Philippines, Japan, South Korea, Israel, and
          several European Union countries such as France, Italy, Germany, Spain, and
          Poland. The U.S. works closely with its NATO allies on military and national
          security issues, and with countries in the Americas through the Organization of
          American States and the United States–Mexico–Canada Free Trade Agreement. The
          U.S. exercises full international defense authority and responsibility for
          Micronesia, the Marshall Islands, and Palau through the Compact of Free
          Association. It has increasingly conducted strategic cooperation with India,
          while its ties with China have steadily deteriorated. Beginning in 2014, the
          U.S. had become a key ally of Ukraine. The president is the commander-in-chief
          of the United States Armed Forces and appoints its leaders, the secretary of
          defense and the Joint Chiefs of Staff. The Department of Defense, headquartered
          at the Pentagon near Washington, D.C., administers five of the six service
          branches, which are made up of the U.S. Army, Marine Corps, Navy, Air Force, and
          Space Force. The Coast Guard is administered by the Department of Homeland
          Security in peacetime and can be transferred to the Department of the Navy in
          wartime. Total strength of the entire military is about 1.3 million active duty
          with an additional 400,000 in reserve. The United States military is widely
          regarded as the most powerful and advanced in the world. The U.S. spent $954
          billion on its military in 2025, which is by far the largest amount of any
          country, making up 33% of global military spending and accounting for 3.1% of
          the country's GDP. The U.S. possesses 42% of the world's nuclear weapons—the
          second-largest stockpile after that of Russia. The United States has the
          third-largest combined armed forces in the world, behind the Chinese People's
          Liberation Army and Indian Armed Forces. In addition to the vast network of
          military bases on its soil, the U.S. maintains approximately 800 other bases and
          installations around the world, and it deploys greater than 100 active-duty
          personnel in each of 25 foreign countries. The United States has engaged in over
          400 military interventions since its founding in 1776, with over half of these
          occurring between 1950 and 2019 and 25% occurring in the post–Cold War era.
          State defense forces (SDFs) are military units that operate under the sole
          authority of a state government. SDFs are authorized by state and federal law
          but are under the command of the state's governor. By contrast, the 54 U.S.
          National Guard organizations fall under the dual control of state or territorial
          governments and the federal government; their units can also become federalized
          entities, but SDFs cannot be federalized. The National Guard personnel of a
          state or territory can be federalized by the president under the National
          Defense Act Amendments of 1933; this legislation created the Guard and provides
          for the integration of Army National Guard and Air National Guard units and
          personnel into the U.S. Army and (since 1947) the U.S. Air Force. The total
          number of National Guard members is about 430,000, while the estimated combined
          strength of SDFs is less than 10,000. There are about 18,000 U.S. police
          agencies from local to national level in the United States. Law in the United
          States is mainly enforced by local police departments and sheriff departments in
          their municipal or county jurisdictions. The state police departments have
          authority in their respective state, and federal agencies such as the Federal
          Bureau of Investigation (FBI) and the U.S. Marshals Service have national
          jurisdiction and specialized duties, such as protecting civil rights, national
          security, enforcing U.S. federal courts' rulings and federal laws, and
          interstate criminal activity. State courts conduct almost all civil and criminal
          trials, while federal courts adjudicate the much smaller number of civil and
          criminal cases that relate to federal law. There is no unified "criminal justice
          system" in the United States. The American prison system is largely
          heterogenous, with thousands of relatively independent systems operating across
          federal, state, local, and tribal levels. In 2026, "these systems hold nearly 2
          million people in 1,566 state prisons, 98 federal prisons, 3,116 local jails,
          1,277 juvenile correctional facilities, 220 immigration detention facilities,
          and 77 Indian country jails, as well as in military prisons, civil commitment
          centers, state psychiatric hospitals, and prisons in the U.S. territories—at a
          system-wide cost of at least $445 billion each year." Despite disparate systems
          of confinement, four main institutions dominate: federal prisons, state prisons,
          local jails, and juvenile correctional facilities. Federal prisons are run by
          the Federal Bureau of Prisons and hold pretrial detainees as well as people who
          have been convicted of federal crimes. State prisons, run by the department of
          corrections of each state, hold people sentenced and serving prison time
          (usually longer than one year) for felony offenses. Local jails are county or
          municipal facilities that incarcerate defendants prior to trial; they also hold
          those serving short sentences (typically under a year). Juvenile correctional
          facilities are operated by local or state governments and serve as longer-term
          placements for any minor adjudicated as delinquent and ordered by a judge to be
          confined. In January 2023, the United States had the sixth-highest per capita
          incarceration rate in the world—531 people per 100,000 inhabitants—and the
          largest prison and jail population in the world, with more than 1.9 million
          people incarcerated. An analysis of the World Health Organization Mortality
          Database from 2010 showed U.S. homicide rates "were 7 times higher than in other
          high-income countries, driven by a gun homicide rate that was 25 times higher".
          The U.S. has a highly developed mixed economy that has been the world's largest
          nominally since about 1890. Its 2024 gross domestic product (GDP) of more than
          $29 trillion constituted over 25% of nominal global economic output, or 15% at
          purchasing power parity (PPP). From 1983 to 2008, U.S. real compounded annual
          GDP growth was 3.3%, compared to a 2.3% weighted average for the rest of the G7.
          The country ranks first in the world by nominal GDP, second when adjusted for
          purchasing power parities (PPP), and ninth by PPP-adjusted GDP per capita. In
          February 2024, the total U.S. federal government debt was $34.4 trillion. Of the
          world's 500 largest companies by revenue, 138 were headquartered in the U.S. in
          2025, the highest number of any country. The U.S. dollar is the currency most
          used in international transactions and the world's foremost reserve currency,
          backed by the country's dominant economy, its military, the petrodollar system,
          its large U.S. treasuries market, and its linked eurodollar. Several countries
          use it as their official currency, and in others it is the de facto currency.
          The U.S. has free trade agreements with several countries, including the USMCA.
          Although the United States has reached a post-industrial level of economic
          development and is often described as having a service economy, it remains a
          major industrial power; in 2024, the U.S. manufacturing sector was the world's
          second-largest by value output after China's. New York City is the world's
          principal financial center, and its metropolitan area is the world's largest
          metropolitan economy. The New York Stock Exchange and Nasdaq, both located in
          New York City, are the world's two largest stock exchanges by market
          capitalization and trade volume. The United States is at the forefront of
          technological advancement and innovation in many economic fields, especially in
          artificial intelligence; electronics and computers; pharmaceuticals; and
          medical, aerospace and military equipment. The country's economy is fueled by
          abundant natural resources, a well-developed infrastructure, and high
          productivity. The largest trading partners of the United States are the European
          Union, Mexico, Canada, China, Japan, South Korea, the United Kingdom, Vietnam,
          India, and Taiwan. The United States is the world's largest importer and
          second-largest exporter. It is by far the world's largest exporter of services.
          Americans have the highest average household and employee income among OECD
          member states, and the fourth-highest median household income in 2023, up from
          sixth-highest in 2013. With personal consumption expenditures of over $18.5
          trillion in 2023, the U.S. has a heavily consumer-driven economy and is the
          world's largest consumer market. The U.S. ranked first in the number of dollar
          billionaires and millionaires in 2023, with 735 billionaires and nearly 22
          million millionaires. Wealth in the United States is highly concentrated; in
          2011, the richest 10% of the adult population owned 72% of the country's
          household wealth, while the bottom 50% owned just 2%. U.S. wealth inequality
          increased substantially since the late 1980s, and income inequality in the U.S.
          reached a record high in 2019. In 2024, the country had some of the highest
          wealth and income inequality levels among OECD countries. Since the 1970s, there
          has been a decoupling of U.S. wage gains from worker productivity. In 2016, the
          top fifth of earners took home more than half of all income, giving the U.S. one
          of the widest income distributions among OECD countries. There were about
          771,480 homeless persons in the U.S. in 2024. In 2022, 6.4 million children
          experienced food insecurity. Feeding America estimates that around one in five,
          or approximately 13 million, children experience hunger in the U.S. and do not
          know where or when they will get their next meal. Also in 2022, about 37.9
          million people, or 11.5% of the U.S. population, were living in poverty. The
          United States has a smaller welfare state and redistributes less income through
          government action than most other high-income countries. It is the only advanced
          economy that does not guarantee its workers paid vacation nationally and one of
          a few countries in the world without federal paid family leave as a legal right.
          The United States has a higher percentage of low-income workers than almost any
          other developed country, largely because of a weak collective bargaining system
          and lack of government support for at-risk workers. The United States has been a
          leader in technological innovation since the late 19th century and scientific
          research since the mid-20th century. Methods for producing interchangeable parts
          and the establishment of a machine tool industry enabled the large-scale
          manufacturing of U.S. consumer products in the late 19th century. By the early
          20th century, factory electrification, the introduction of the assembly line,
          and other labor-saving techniques created the system of mass production. In the
          21st century, the United States continues to be one of the world's foremost
          scientific powers, though China has emerged as a major competitor in many
          fields. The U.S. has the highest research and development expenditures of any
          country and ranks ninth as a percentage of GDP. In 2022, the United States was
          (after China) the country with the second-highest number of published scientific
          papers. In 2021, the U.S. ranked second (also after China) by the number of
          patent applications, and third by trademark and industrial design applications
          (after China and Germany), according to World Intellectual Property Indicators.
          In 2025 the United States ranked third (after Switzerland and Sweden) in the
          Global Innovation Index. The United States is considered to be a world leader in
          the development of artificial intelligence technology. In 2023, the United
          States was ranked the second most technologically advanced country in the world
          (after South Korea) by Global Finance magazine. The United States has maintained
          a space program since the late 1950s, beginning with the establishment of the
          National Aeronautics and Space Administration (NASA) in 1958. NASA's Apollo
          program (1961–1972) achieved the first crewed Moon landing with the 1969 Apollo
          11 mission; it remains one of the agency's most significant milestones. Other
          major endeavors by NASA include the Space Shuttle program (1981–2011), the
          Voyager program (1972–present), the Hubble and James Webb space telescopes
          (launched in 1990 and 2021, respectively), and the multi-mission Mars
          Exploration Program (Spirit, Opportunity, Curiosity, and Perseverance). NASA is
          one of five agencies collaborating on the International Space Station (ISS);
          U.S. contributions to the ISS include several modules, including Destiny (2001),
          Harmony (2007), and Tranquility (2010), as well as ongoing logistical and
          operational support. The United States private sector dominates the global
          commercial spaceflight industry. Prominent American spaceflight contractors
          include Blue Origin, Boeing, Lockheed Martin, Northrop Grumman, and SpaceX. NASA
          programs such as the Commercial Crew Program, Commercial Resupply Services,
          Commercial Lunar Payload Services, and NextSTEP have facilitated growing
          private-sector involvement in American spaceflight. In 2023, the United States
          received approximately 84% of its energy from fossil fuel, and its largest
          source of energy was petroleum (38%), followed by natural gas (36%), renewable
          sources (9%), coal (9%), and nuclear power (9%). In 2022, the United States
          constituted about 4% of the world's population, but consumed around 16% of the
          world's energy. The U.S. ranks as the second-highest emitter of greenhouse gases
          behind China. The U.S. is the world's largest producer of nuclear power,
          generating around 30% of the world's nuclear electricity. It also has the
          highest number of nuclear power reactors of any country. From 2024, the U.S.
          plans to triple its nuclear power capacity by 2050. The United States' 4 million
          miles (6.4 million kilometers) of road network, owned almost entirely by state
          and local governments, is the longest in the world. The extensive Interstate
          Highway System that connects all major U.S. cities is funded mostly by the
          federal government but maintained by state departments of transportation. The
          system is further extended by state highways and some private toll roads. The
          U.S. is among the top ten countries with the highest vehicle ownership per
          capita (850 vehicles per 1,000 people) in 2022. A 2022 study found that 76% of
          U.S. commuters drive alone and 14% ride a bicycle, including bike owners and
          users of bike-sharing networks. About 11% use some form of public
          transportation. Public transportation in the United States is well developed in
          the largest urban areas, notably New York City, Washington, D.C., Boston,
          Philadelphia, Chicago, and San Francisco; otherwise, coverage is generally less
          extensive than in most other developed countries. The U.S. also has many
          relatively car-dependent localities. Long-distance intercity travel is provided
          primarily by airlines, but travel by rail is more common along the Northeast
          Corridor, the only high-speed rail in the U.S. that meets international
          standards. Amtrak, the country's government-sponsored national passenger rail
          company, has a relatively sparse network compared to that of Western European
          countries. Service is concentrated in the Northeast, California, the Midwest,
          the Pacific Northwest, and Virginia/Southeast. The United States has an
          extensive air transportation network. U.S. civilian airlines are all privately
          owned. The three largest airlines in the world, by total number of passengers
          carried, are U.S.-based; American Airlines became the global leader after its
          2013 merger with US Airways. Of the 50 busiest airports in the world, 16 are in
          the United States, as well as five of the top 10. The world's busiest airport by
          passenger volume is Hartsfield–Jackson Atlanta International in Atlanta,
          Georgia. In 2022, most of the 19,969 U.S. airports were owned and operated by
          local government authorities, and there are also some private airports. Some
          5,193 are designated as "public use", including for general aviation. The
          Transportation Security Administration (TSA) has provided security at most major
          airports since 2001. The country's rail transport network, the longest in the
          world at 182,412.3 mi (293,564.2 km), handles mostly freight (in contrast to
          more passenger-centered rail in Europe). Because they are often privately owned
          operations, U.S. railroads lag behind those of the rest of the world in terms of
          electrification. The country's inland waterways are the world's fifth-longest,
          totaling 25,482 mi (41,009 km). They are used extensively for freight,
          recreation, and a small amount of passenger traffic. Of the world's 50 busiest
          container ports, four are located in the United States, with the busiest in the
          country being the Port of Los Angeles. The U.S. Census Bureau reported
          331,449,281 residents on April 1, 2020, making the United States the
          third-most-populous country in the world, after India and China. The Census
          Bureau's official 2025 population estimate was 341,784,857, an increase of 3.1%
          since the 2020 census. According to the Bureau's U.S. Population Clock, on July
          1, 2024, the U.S. population had a net gain of one person every 16 seconds, or
          about 5400 people per day. In 2023, 51% of Americans age 15 and over were
          married, 6% were widowed, 10% were divorced, and 34% had never been married. In
          2023, the total fertility rate for the U.S. stood at 1.6 children per woman,
          and, at 23%, it had the world's highest rate of children living in single-parent
          households in 2019. Most Americans live in the suburbs of major metropolitan
          areas. The United States has a diverse population; 37 ancestry groups have more
          than one million members. White Americans with ancestry from Europe, the Middle
          East, or North Africa form the largest racial and ethnic group at 57.8% of the
          United States population. Hispanic and Latino Americans form the second-largest
          group and are 18.7% of the United States population. African Americans
          constitute the country's third-largest ancestry group and are 12.1% of the total
          U.S. population. Asian Americans are the country's fourth-largest group,
          composing 5.9% of the United States population. The country's 3.7 million Native
          Americans account for about 1%, and some 574 native tribes are recognized by the
          federal government. In 2024, the median age of the United States population was
          39.1 years. About 82% of Americans live in metropolitan areas, particularly in
          suburbs and outer-ring exurbs; about half of those reside in cities with
          populations over 50,000. In 2024, 346 incorporated U.S. municipalities had
          populations over 100,000, 11 cities had more than one million residents, and
          four cities—New York City, Los Angeles, Chicago, and Houston—had populations
          exceeding two million. Some 56 U.S. metropolitan areas have one million or more
          residents. More recently, the fastest-growing metropolitan areas were in the
          South, while southern metros along the Mexican border and Gulf Coast metros
          susceptible to hurricanes declined the most in 2025. The New York metro area,
          which gained the most new residents in 2024, fell to 13th in 2025, due to a fall
          in immigrants. The top metro areas with rising populations in 2025 were Houston
          and Dallas–Fort Worth, followed by Atlanta, Phoenix and Charlotte. While many
          languages and dialects are spoken in the United States, English is by far the
          most commonly spoken and written. De facto, English is the official language of
          the United States, and in 2025, Executive Order 14224 declared English official.
          However, the U.S. has never had a statutory official language, as Congress has
          never passed a law to designate English as official for all three federal
          branches. Some laws, such as U.S. naturalization requirements, nonetheless
          standardize English. Twenty-eight states and the United States Virgin Islands
          have laws that designate English as the sole official language; 19 states and
          the District of Columbia have no official language. Three states and four U.S.
          territories have recognized local or indigenous languages in addition to
          English: Hawaii (Hawaiian), Alaska (twenty Native languages), South Dakota
          (Sioux), American Samoa (Samoan), Puerto Rico (Spanish), Guam (Chamorro), and
          the Northern Mariana Islands (Carolinian and Chamorro). In total, 169 Native
          American languages are spoken in the United States. In Puerto Rico, Spanish is
          more widely spoken than English. According to the American Community Survey
          (2020), some 245.4 million people in the U.S. age five and older spoke only
          English at home. About 41.2 million spoke Spanish at home, making it the second
          most commonly used language. Other languages spoken at home by one million
          people or more include Chinese (3.40 million), Tagalog (1.71 million),
          Vietnamese (1.52 million), Arabic (1.39 million), French (1.18 million), Korean
          (1.07 million), and Russian (1.04 million). German, spoken by 1 million people
          at home in 2010, fell to 881,000 estimated total speakers in 2020. America's
          immigrant population is by far the world's largest in absolute terms. In 2022,
          there were 87.7 million immigrants and U.S.-born children of immigrants in the
          United States, accounting for nearly 27% of the overall U.S. population. In
          2017, out of the U.S. foreign-born population, some 45% (20.7 million) were
          naturalized citizens, 27% (12.3 million) were lawful permanent residents, 6%
          (2.2 million) were temporary lawful residents, and 23% (10.5 million) were
          unauthorized immigrants. In 2019, the top countries of origin for immigrants
          were Mexico (24% of immigrants), India (6%), China (5%), the Philippines (4.5%),
          and El Salvador (3%). In fiscal year 2022, over one million immigrants (most of
          whom entered through family reunification) were granted legal residence. The
          undocumented immigrant population in the U.S. reached a record high of 14
          million in 2023. The First Amendment guarantees the free exercise of religion in
          the country and forbids Congress from passing laws respecting its establishment.
          Religious practice is widespread, among the most diverse in the world, and
          profoundly vibrant. The country has the world's largest Christian population,
          which includes the fourth-largest population of Catholics. Other notable faiths
          include Judaism, Buddhism, Hinduism, Islam, New Age, and Native American
          religions. Religious practice varies significantly by region. "Ceremonial deism"
          is common in American culture. The overwhelming majority of Americans believe in
          a higher power or spiritual force, engage in spiritual practices such as prayer,
          and consider themselves religious or spiritual. In the Southern United States'
          "Bible Belt", evangelical Protestantism plays a significant role culturally; New
          England and the Western United States tend to be more secular. Mormonism, a
          Restorationist movement founded in the U.S. in 1847, is the predominant religion
          in Utah and a major religion in Idaho. According to the Centers for Disease
          Control and Prevention (CDC), average U.S. life expectancy at birth reached 79.0
          years in 2024, its highest recorded level. This was an increase of 0.6 years
          over 2023. The CDC attributed the improvement to a significant fall in the
          number of fatal drug overdoses in the country, noting that "heart disease
          continues to be the leading cause of death in the United States, followed by
          cancer and unintentional injuries." In 2024, life expectancy at birth for
          American men rose to 76.5 years (+0.7 years compared to 2023), while life
          expectancy for women was 81.4 years (+0.3 years). Starting in 1998, life
          expectancy in the U.S. fell behind that of other wealthy industrialized
          countries, and Americans' "health disadvantage" gap has been increasing ever
          since. The Commonwealth Fund reported in 2020 that the U.S. had the highest
          suicide rate among high-income countries. Approximately one-third of the U.S.
          adult population is obese, and another third is overweight. The U.S. healthcare
          system far outspends that of any other country, measured both in per capita
          spending and as a percentage of GDP, but attains worse healthcare outcomes when
          compared to peer countries for reasons that are debated. The United States is
          the only developed country without a system of universal healthcare, and a
          significant proportion of the population that does not carry health insurance.
          Government-funded healthcare coverage for the poor (Medicaid) and for those age
          65 and older (Medicare) is available to Americans who meet the programs' income
          or age qualifications. In 2010, President Barack Obama passed the Patient
          Protection and Affordable Care Act. Since the 2022 U.S. Supreme Court decision
          Dobbs v. Jackson Women's Health Organization, which effectively overruled Roe v.
          Wade (1973), abortion in the United States is not federally protected. It is now
          either illegal or restricted in 17 of the 50 states. American primary and
          secondary education, known in the U.S. as K–12 ("kindergarten through 12th
          grade"), is decentralized. School systems are operated by state, territorial,
          and sometimes municipal governments and regulated by the U.S. Department of
          Education. In general, children are required to attend school or an approved
          homeschool from the age of five or six (kindergarten or first grade) until they
          are 18 years old. This often brings students through the 12th grade, the final
          year of a U.S. high school, but some states and territories allow them to leave
          school earlier, at age 16 or 17. The U.S. spends more on education per student
          than any other country, an average of $18,614 per year per public elementary and
          secondary school student in 2020–2021. Among Americans age 25 and older, 92.2%
          graduated from high school, 62.7% attended some college, 37.7% earned a
          bachelor's degree, and 14.2% earned a graduate degree. The U.S. literacy rate is
          near-universal. The U.S. has produced the most Nobel Prize winners of any
          country, with 411 (having won 413 awards). U.S. tertiary or higher education has
          earned a global reputation. Many of the world's top universities, as listed by
          various ranking organizations, are in the United States, including 19 of the top
          25. American higher education is dominated by state university systems, although
          the country's many private universities and colleges enroll about 20% of all
          American students. Local community colleges generally offer open admissions,
          lower tuition, and coursework leading to a two-year associate degree or a
          non-degree certificate. As for public expenditures on higher education, the U.S.
          spends more per student than the OECD average, and Americans spend more than all
          nations in combined public and private spending. Colleges and universities
          directly funded by the federal government do not charge tuition and are limited
          to military personnel and government employees, including: the U.S. service
          academies, the Naval Postgraduate School, and military staff colleges. Despite
          some student loan forgiveness programs in place, student loan debt increased by
          102% between 2010 and 2020, and exceeded $1.7 trillion in 2022. The United
          States is home to a wide variety of ethnic groups, traditions, and customs. The
          country has been described as having the values of individualism and personal
          autonomy, as well as a strong work ethic and competitiveness. Voluntary altruism
          toward others also plays a major role; according to a 2016 study by the
          Charities Aid Foundation, Americans donated 1.44% of total GDP to charity—the
          highest rate in the world by a large margin. Americans have traditionally been
          characterized by a unifying political belief in an "American Creed" emphasizing
          consent of the governed, liberty, equality under the law, democracy, social
          equality, property rights, and a preference for limited government. The U.S. has
          acquired significant hard and soft power through its diplomatic influence,
          economic power, military alliances, and cultural exports such as American
          movies, music, video games, sports, and food. The influence that the United
          States exerts on other countries through soft power is referred to as
          Americanization. Nearly all present Americans or their ancestors came from
          Europe, Africa, or Asia (the "Old World") within the past five centuries.
          Mainstream American culture is a Western culture largely derived from the
          traditions of European immigrants with influences from many other sources, such
          as traditions brought by slaves from Africa. More recent immigration from Asia
          and especially Latin America has added to a cultural mix that has been described
          as a homogenizing melting pot, and a heterogeneous salad bowl, with immigrants
          contributing to, and often assimilating into, mainstream American culture. Under
          the First Amendment to the Constitution, the United States is considered to have
          the strongest protections of free speech of any country. Flag desecration, hate
          speech, blasphemy, and lese majesty are all forms of protected expression. A
          2016 Pew Research Center poll found that Americans were the most supportive of
          free expression of any polity measured. Additionally, they are the "most
          supportive of freedom of the press and the right to use the Internet without
          government censorship". The U.S. is a socially progressive country with
          permissive attitudes surrounding human sexuality. LGBTQ rights in the United
          States are among the most advanced by global standards. The American Dream, or
          the perception that Americans enjoy high levels of social mobility, plays a key
          role in attracting immigrants. Whether this perception is accurate has been a
          topic of debate. While mainstream culture holds that the United States is a
          classless society, scholars identify significant differences between the
          country's social classes, affecting socialization, language, and values.
          Americans tend to greatly value socioeconomic achievement, but being ordinary or
          average is promoted by some as a noble condition as well. The National
          Foundation on the Arts and the Humanities is an agency of the United States
          federal government that was established in 1965 with the purpose to "develop and
          promote a broadly conceived national policy of support for the humanities and
          the arts in the United States, and for institutions which preserve the cultural
          heritage of the United States." It is composed of four sub-agencies: National
          Endowment for the Arts National Endowment for the Humanities Institute of Museum
          and Library Services Federal Council on the Arts and the Humanities Colonial
          American authors were influenced by John Locke and other Enlightenment
          philosophers. The American Revolutionary Period (1765–1783) is notable for the
          political writings of Benjamin Franklin, Alexander Hamilton, Thomas Paine, and
          Thomas Jefferson. Shortly before and after the Revolutionary War, the newspaper
          rose to prominence, filling a demand for anti-British national literature. An
          early novel is William Hill Brown's The Power of Sympathy, published in 1791.
          Writer and critic John Neal in the early- to mid-19th century helped advance
          America toward a unique literature and culture by criticizing predecessors such
          as Washington Irving for imitating their British counterparts, and by
          influencing writers such as Edgar Allan Poe, who took American poetry and short
          fiction in new directions. Ralph Waldo Emerson and Margaret Fuller pioneered the
          influential Transcendentalism movement; Henry David Thoreau, author of Walden,
          was influenced by this movement. The conflict surrounding abolitionism inspired
          writers, like Harriet Beecher Stowe, and authors of slave narratives, such as
          Frederick Douglass. Nathaniel Hawthorne's The Scarlet Letter (1850) explored the
          dark side of American history, as did Herman Melville's Moby-Dick (1851). Major
          American poets of the 19th century American Renaissance include Walt Whitman,
          Melville, and Emily Dickinson. Mark Twain was the first major American writer to
          be born in the West. Henry James achieved international recognition with novels
          like The Portrait of a Lady (1881). As literacy rates rose, periodicals
          published more stories centered around industrial workers, women, and the rural
          poor. Naturalism, regionalism, and realism were the major literary movements of
          the period. While modernism generally took on an international character,
          modernist authors working within the United States more often rooted their work
          in specific regions, peoples, and cultures. Following the Great Migration to
          northern cities, African-American and black West Indian authors of the Harlem
          Renaissance developed an independent tradition of literature that rebuked a
          history of inequality and celebrated black culture. An important cultural export
          during the Jazz Age, these writings were a key influence on Négritude, a
          philosophy emerging in the 1930s among francophone writers of the African
          diaspora. In the 1950s, an ideal of homogeneity led many authors to attempt to
          write the Great American Novel, while the Beat Generation rejected this
          conformity, using styles that elevated the impact of the spoken word over
          mechanics to describe drug use, sexuality, and the failings of society.
          Contemporary literature is more pluralistic than in previous eras, with the
          closest thing to a unifying feature being a trend toward self-conscious
          experiments with language. Twelve American laureates have won the Nobel Prize in
          Literature. Media in the United States is broadly uncensored, with the First
          Amendment providing significant protections, as reiterated in New York Times Co.
          v. United States. The four major broadcasters in the U.S. are the National
          Broadcasting Company (NBC), Columbia Broadcasting System (CBS), American
          Broadcasting Company (ABC), and Fox Broadcasting Company (Fox). The four major
          broadcast television networks are all commercial entities. The Public
          Broadcasting Service (PBS) is the country's major non-commercial public
          broadcast network; it also provides educational programming through local PBS
          stations. The U.S. cable television system offers hundreds of channels catering
          to a variety of niches. In 2021, about 83% of Americans over age 12 listened to
          broadcast radio, while about 40% listened to podcasts. In the prior year, there
          were 15,460 licensed full-power radio stations in the U.S. according to the
          Federal Communications Commission (FCC). Public radio broadcasting is largely
          supplied by National Public Radio (NPR), incorporated in February 1970 under the
          Public Broadcasting Act of 1967. U.S. newspapers with a global reach and
          reputation include The Wall Street Journal, The New York Times, The Washington
          Post, and USA Today. About 800 publications are produced in Spanish. With few
          exceptions, newspapers are privately owned, either by large chains such as
          Gannett or McClatchy, which own dozens or even hundreds of newspapers; by small
          chains that own a handful of papers; or, in an increasingly rare situation, by
          individuals or families. Major cities often have alternative newspapers to
          complement the mainstream daily papers, such as The Village Voice in New York
          City and LA Weekly in Los Angeles. The five most-visited websites in the world
          are Google, YouTube, Facebook, Instagram, and ChatGPT—all of them
          American-owned. Other popular platforms used include X (formerly Twitter) and
          Amazon. In 2025, the U.S. was the world's second-largest video game market by
          revenue (after China). In 2015, the U.S. video game industry consisted of 2,457
          companies that employed around 220,000 jobs and generated $30.4 billion in
          revenue. There are 444 game publishers, developers, and hardware companies in
          California alone. According to the Game Developers Conference (GDC), the U.S. is
          the top location for video game development, with 58% of the world's game
          developers based there in 2025. The United States is well known for its theater.
          Mainstream theater in the United States derives from the old European theatrical
          tradition and has been heavily influenced by the British theater. By the middle
          of the 19th century, America had created new distinct dramatic forms in the Tom
          Shows, the showboat theater and the minstrel show. The central hub of the
          American theater scene is the Theater District in Manhattan, with its divisions
          of Broadway, off-Broadway, and off-off-Broadway. Many movie and television
          celebrities have gotten their big break working in New York productions. Outside
          New York City, many cities have professional regional or resident theater
          companies that produce their own seasons. The biggest-budget theatrical
          productions are musicals. U.S. theater has an active community theater culture.
          The Tony Awards recognize excellence in live Broadway theater and are presented
          at an annual ceremony in Manhattan. The awards are given for Broadway
          productions and performances. One is also given for regional theater. Folk art
          in colonial America grew out of artisanal craftsmanship in communities that
          allowed commonly trained people to individually express themselves. It was
          distinct from Europe's tradition of high art, which was less accessible and
          generally less relevant to early American settlers. Cultural movements in art
          and craftsmanship in colonial America generally lagged behind those of Western
          Europe. For example, the prevailing medieval style of woodworking and primitive
          sculpture became integral to early American folk art, despite the emergence of
          Renaissance styles in England in the late 16th and early 17th centuries. The new
          English styles would have been early enough to make a considerable impact on
          American folk art, but American styles and forms had already been firmly
          adopted. Not only did styles change slowly in early America, but there was a
          tendency for rural artisans there to continue their traditional forms longer
          than their urban counterparts did—and far longer than those in Western Europe.
          The Hudson River School was a mid-19th-century movement in the visual arts
          tradition of European naturalism. The 1913 Armory Show in New York City, an
          exhibition of European modernist art, shocked the public and transformed the
          U.S. art scene. American Realism and American Regionalism sought to reflect and
          give America new ways of looking at itself. Georgia O'Keeffe, Marsden Hartley,
          and others experimented with new and individualistic styles, which would become
          known as American modernism. Major artistic movements such as the abstract
          expressionism of Jackson Pollock

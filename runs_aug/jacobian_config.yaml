        #   这是一首由唐代诗人王之涣创作的名篇《登鹳雀楼》。它是中国文学中最著名的五言绝句之一。
        # - >
        #   这首诗描绘了夕阳依山而落、黄河奔涌向海的壮丽景象。后两句更是流传千古的哲理：如果你想看到更远处的风景（达到更高的境界），就必须再登上一层楼。
        # - >
        #   An electric field (sometimes called E-field[1]) is a physical field that surrounds electrically charged particles such as electrons. In classical electromagnetism, the electric field of a single charge (or group of charges) describes their capacity to exert attractive or repulsive forces on another charged object. Charged particles exert attractive forces on each other when the sign of their charges are opposite, one being positive while the other is negative, and repel each other when the signs of the charges are the same. Because these forces are exerted mutually, two charges must be present for the forces to take place. These forces are described by Coulomb's law, which says that the greater the magnitude of the charges, the greater the force, and the greater the distance between them, the weaker the force. Informally, the greater the charge of an object, the stronger its electric field. Similarly, an electric field is stronger nearer charged objects and weaker further away. Electric fields originate from electric charges and time-varying electric currents. Electric fields and magnetic fields are both manifestations of the electromagnetic field. Electromagnetism is one of the four fundamental interactions of nature.
        # - >
        #   Electric fields are important in many areas of physics, and are exploited in electrical technology. For example, in atomic physics and chemistry, the interaction in the electric field between the atomic nucleus and electrons is the force that holds these particles together in atoms. Similarly, the interaction in the electric field between atoms is the force responsible for chemical bonding that result in molecules. The electric field is defined as a vector field that associates to each point in space the force per unit of charge exerted on an infinitesimal positive test charge at rest at that point.[2][3][4] The SI unit for the electric field is the volt per meter (V/m), which is equal to the newton per coulomb (N/C).[5]



        - >
          An apple is the round, edible fruit of an apple tree (Malus spp.). Fruit trees of the orchard or domestic apple (Malus domestica), the most widely grown in the genus, are cultivated worldwide. The tree originated in Central Asia, where its wild ancestor, Malus sieversii, is still found. Apples have been grown for thousands of years in Eurasia before they were introduced to North America by European colonists. Apples have cultural significance in many mythologies (including Norse and Greek) and religions (such as Christianity in Europe).
          Apples grown from seeds tend to be very different from those of their parents, and the resultant fruit frequently lacks desired characteristics. For commercial purposes, including botanical evaluation, apple cultivars are propagated by clonal grafting onto rootstocks. Apple trees grown without rootstocks tend to be larger and much slower to fruit after planting. Rootstocks are used to control the speed of growth and the size of the resulting tree, allowing for easier harvesting.
          There are more than 7,500 cultivars of apples. Different cultivars are bred for various tastes and uses, including cooking, eating raw, and cider or apple juice production. Trees and fruit are prone to fungal, bacterial, and pest problems, which can be controlled by a number of organic and non-organic means. In 2010, the fruit's genome was sequenced as part of research on disease control and selective breeding in apple production.
          The word apple is derived from Old English æppel, meaning "fruit", not specifically the apple.[4] That in turn is descended from the Proto-Germanic noun *aplaz, descended in turn from Proto-Indo-European *h₂ébōl.[5] As late as the 17th century, the word also functioned as a generic term for all fruit including nuts; one example is the pineapple, the swollen accessory fruit outside of the cashew nut known as the "cashew apple",[6] another is a 14th-century Middle English expression appel of paradis, meaning a banana.[4]
          The apple tree is deciduous, generally standing from 2 to 4.5 metres (6 to 15 feet) tall in cultivation and up to 15 m (49 ft) in the wild, though more typically 2 to 10 m (6.5 to 33 ft).[7][2] When cultivated, the size, shape and branch density are determined by rootstock selection and trimming method.[7] Apple trees may naturally have a rounded to erect crown with a dense canopy of leaves.[8] The bark of the trunk is dark gray or gray-brown, but young branches are reddish or dark-brown with a smooth texture.[2][9] Young twigs are covered in fine downy hairs; they become hairless when older.[9]
          The buds are egg-shaped and dark red or purple in color; they range in size from 3 to 5mm, but are usually less than 4mm. The bud scales have very hairy edges. When emerging from the buds, the leaves are convolute, meaning that their edges overlap each other.[2] Leaves can be simple ovals (elliptic), medium or wide in width, somewhat egg-shaped with the wider portion toward their base (ovate), or even with sides that are more parallel to each other instead of curved (oblong) with a narrow pointed end.[9][2] The edges have broadly-angled teeth, but do not have lobes. The top surface of the leaves are glabrescent, almost hairless, while the undersides are densely covered in fine hairs.[2] The leaves are attached alternately by short leaf stems 1-to-3.5 cm (1⁄2-to-1+1⁄2 in) long.[8][2]
          Blossoms are produced in spring simultaneously with the budding of the leaves and are produced on spurs and some long shoots.[7] When the flower buds first begin to open the petals are rose-pink and fade to white or light pink when fully open with each flower 3-to-4-centimeter (1-to-1+1⁄2-inch) in diameter.[2] The five-petaled flowers are group in an inflorescence consisting of a cyme with 3–7 flowers.[10] The central flower of the inflorescence is called the "king bloom"; it opens first and can develop a larger fruit.[8] Open apple blossoms are damaged by even brief exposures to temperatures −2 °C (28 °F) or less, although the overwintering wood and buds are hardy down to −40 °C (−40 °F).[10]
          The fruit is a pome that matures in late summer or autumn.[2] The true fruits or carpels are the harder interior chambers inside the apple's core. There are usually five carpels inside an apple, but there may be as few as three. Each of the chambers contains one or two seeds.[11] The edible flesh is formed from the receptacle at the base of the flower.[12]
        # - >
        #   Apple Inc. is an American multinational technology company headquartered in Cupertino, California, in Silicon Valley, and known for consumer electronics, software and online services. Founded in 1976 as Apple Computer Company by Steve Jobs, Steve Wozniak and Ronald Wayne, the company was incorporated by Jobs and Wozniak as Apple Computer, Inc. the following year. It was renamed to its current name in 2007 as the company expanded its focus from computers to consumer electronics. Apple is one of the Big Tech companies.
        #   The company was founded to market Wozniak's Apple I personal computer. Its successor, the Apple II, became one of the first successful mass-produced microcomputers. Apple introduced the Lisa in 1983 and the Macintosh in 1984 as some of the first computers to use a graphical user interface and a mouse. By 1985, internal conflicts led to Jobs leaving the company to form NeXT and Wozniak withdrawing to other ventures; John Sculley was CEO for over a decade. In the 1990s, Apple lost considerable market share in the PC industry to the lower-priced Wintel duopoly of Intel-powered PC clones running Windows, and neared bankruptcy by 1997. To overhaul its market strategy, Apple acquired NeXT, bringing Jobs back to the company. Under his leadership, Apple returned to profitability by introducing the iMac, iPod, iPhone, and iPad devices; creating the iTunes Store; launching the "Think different" advertising campaign; and opening the Apple Store retail chain. Jobs resigned in 2011 for health reasons and died the same year; he was succeeded as CEO by Tim Cook, who will be succeeded by John Ternus in 2026.
        # - >
        #   Windows is a proprietary graphical operating system developed and marketed by Microsoft. Windows is grouped into families that cater to particular sectors of the computing industry – Windows for personal computers, Windows Server for servers, and Windows IoT for embedded systems. Windows itself is further grouped into editions that cater to different users – Home for home users, Professional for advanced users, Education for schools, and Enterprise for corporations. Windows is sold both as a consumer retail product and to computer manufacturers, who bundle and distribute it with their systems.
        #   The first version of Windows, Windows 1.0, was released on November 20, 1985 as a graphical operating system shell for MS-DOS in response to growing interest in graphical user interfaces (GUIs).[13] The name Windows is a reference to the windowing system in GUIs.[14] The 1990 release of Windows 3.0 catapulted its market success and led to the launch of various other product families, including the (now-defunct) Windows Mobile, Windows Phone, and Windows CE/Embedded Compact.
        # - >
        #   Microsoft Corporation is an American multinational technology company headquartered in Redmond, Washington. The company became influential in the rise of personal computers through software like Windows and has since expanded into areas such as Internet services, cloud computing, artificial intelligence, video gaming, software, and more. A Big Tech company, Microsoft is the largest software company by revenue, one of the most valuable public companies, and one of the most valuable brands globally.
        # - >
        #   William Henry Gates III (born October 28, 1955) is an American businessman and philanthropist. A pioneer of the microcomputer revolution of the 1970s and 1980s, he co-founded the software company Microsoft in 1975 with his childhood friend Paul Allen. Following Microsoft's initial public offering in 1986 and the subsequent increase in its stock price, Gates became the world's then-youngest billionaire in 1987, at age 31. Forbes magazine ranked him as the world's wealthiest person for 18 out of 24 years between 1995 and 2017, including 13 years consecutively from 1995 to 2007. Gates became the first centibillionaire in 1999, when his net worth briefly surpassed US$100 billion. According to Forbes, as of February 2026, his net worth stood at US$107.7 billion, making him the 18th-wealthiest individual in the world.[1][2]
        - >
         Whether you’re a student, a teacher, or a parent, I think you’ll appreciate this story of how one teacher can completely and permanently change someone’s life in only a few lessons. 
         I was seventeen and about to start my first year at Berklee College of Music.
         I called a local recording studio with a random question about music typesetting.When the studio owner heard I was going to Berklee, he said, “I graduated from Berklee and taught there, too. I’ll bet I can teach you two years of theory and arranging in only a few lessons. I suspect you can graduate in two years if you understand there’s no speed limit. Come by my studio at 9:00 tomorrow for your first lesson, if you’re interested. No charge.”
         Graduate college in two years? Awesome! I liked his style. That was Kimo Williams.
         I showed up at his studio at 8:40 the next morning, super excited, though I waited outside before ringing his bell at 8:59.
         He opened the door. A tall man in a Hawaiian shirt and a big hat, with a square scar on his nose, a laid-back demeanor, and a huge smile, sizing me up, nodding.
         (Recently I heard him tell the story from his perspective. He said, “My doorbell rang at 8:59 one morning and I had no idea why. I run across kids all the time who say they want to be a great musician. I tell them I can help, and tell them to show up at my studio at 9:00 if they’re serious. Nobody ever does. It’s how I weed out the really serious ones from the kids who just talk. But there was Derek, ready to go.”)
         After a one-minute welcome, we were sitting at the piano, analyzing the sheet music for a jazz standard. He was quickly explaining the chords based on the diatonic scale — how the dissonance of the tri-tone in the 5-chord with the flat-7 is what makes it want to resolve to the 1. Within a minute, he started quizzing me.
         “If the 5-chord with the flat-7 has that tri-tone, then so does another flat-7 chord. Which one?”
         “Uh… the flat-2 chord?”
         “Right! So that’s a substitute chord. Any flat-7 chord can be substituted with the other flat-7 that shares the same tri-tone. So reharmonize all the chords you can in this chart. Go.”
         The pace was intense, and I loved it. Finally, someone was challenging me — keeping me in over my head — encouraging and expecting me to pull myself up quickly. I was learning so fast, it felt like the adrenaline rush you get while playing a video game. He tossed every fact at me and made me prove that I got it.
         In our three-hour lesson that morning, he taught me a full semester of Berklee’s harmony courses. In our next four lessons, he taught me the next four semesters of harmony and arranging classes. When I got to college and took my entrance exams, I tested out of those six semesters of requirements
         Then, as Kimo suggested, I bought the course materials for other required classes and taught myself, doing the homework in my own time. Then I went to the department head and took the final exam, getting full credit for those courses.
         By doing this in addition to completing my full course load, I graduated college in two and a half years. I got my bachelor’s degree when I was twenty.
         Kimo’s high expectations set a new pace for me. He taught me that “the standard pace is for chumps” — that the system is designed so anyone can keep up. If you’re more driven than most people, you can do way more than anyone expects. And this principle applies to all of life, not just school.
         Before I met Kimo, I was just a kid who wanted to be a musician, doing it casually. Ever since our five lessons, I’ve had no speed limit. I owe every great thing that’s happened in my life to Kimo’s raised expectations. A random meeting and five music lessons showed me that I can do way more than the norm.
         Twenty years later, Berklee invited me to give the opening keynote speech to incoming first-year students. Go to sive.rs/berklee to see it. Kimo knows how much he means to me, and we’re friends to this day.
        - >
         The Industrial Revolution and its consequences have been a disaster for the human race. They have greatly increased the life-expectancy of those of us who live in “advanced” countries, but they have destabilized society, have made life unfulfilling, have subjected human beings to indignities, have led to widespread psychological suffering (in the Third World to physical suffering as well) and have inflicted severe damage on the natural world. The continued development of technology will worsen the situation. It will certainly subject human beings to greater indignities and inflict greater damage on the natural world, it will probably lead to greater social disruption and psychological suffering, and it may lead to increased physical suffering even in “advanced” countries.
         2. The industrial-technological system may survive or it may break down. If it survives, it MAY eventually achieve a low level of physical and psychological suffering, but only after passing through a long and very painful period of adjustment and only at the cost of permanently reducing human beings and many other living organisms to engineered products and mere cogs in the social machine. Furthermore, if the system survives, the consequences will be inevitable: There is no way of reforming or modifying the system so as to prevent it from depriving people of dignity and autonomy.
         3. If the system breaks down the consequences will still be very painful. But the bigger the system grows the more disastrous the results of its breakdown will be, so if it is to break down it had best break down sooner rather than later.
         4. We therefore advocate a revolution against the industrial system. This revolution may or may not make use of violence; it may be sudden or it may be a relatively gradual process spanning a few decades. We can’t predict any of that. But we do outline in a very general way the measures that those who hate the industrial system should take in order to prepare the way for a revolution against that form of society. This is not to be a POLITICAL revolution. Its object will be to overthrow not governments but the economic and technological basis of the present society.
         5. In this article we give attention to only some of the negative developments that have grown out of the industrial-technological system. Other such developments we mention only briefly or ignore altogether. This does not mean that we regard these other developments as unimportant. For practical reasons we have to confine our discussion to areas that have received insufficient public attention or in which we have something new to say. For example, since there are well-developed environmental and wilderness movements, we have written very little about environmental degradation or the destruction of wild nature, even though we consider these to be highly important.
         6. Almost everyone will agree that we live in a deeply troubled society. One of the most widespread manifestations of the craziness of our world is leftism, so a discussion of the psychology of leftism can serve as an introduction to the discussion of the problems of modern society in general.
         7. But what is leftism? During the first half of the 20th century leftism could have been practically identified with socialism. Today the movement is fragmented and it is not clear who can properly be called a leftist. When we speak of leftists in this article we have in mind mainly socialists, collectivists, “politically correct” types, feminists, gay and disability activists, animal rights activists and the like. But not everyone who is associated with one of these movements is a leftist. What we are trying to get at in discussing leftism is not so much movement or an ideology as a psychological type, or rather a collection of related types. Thus, what we mean by “leftism” will emerge more clearly in the course of our discussion of leftist psychology. (Also, see paragraphs 227-230.)
         8. Even so, our conception of leftism will remain a good deal less clear than we would wish, but there doesn’t seem to be any remedy for this. All we are trying to do here is indicate in a rough and approximate way the two psychological tendencies that we believe are the main driving force of modern leftism. We by no means claim to be telling the WHOLE truth about leftist psychology. Also, our discussion is meant to apply to modern leftism only. We leave open the question of the extent to which our discussion could be applied to the leftists of the 19th and early 20th centuries.
         9. The two psychological tendencies that underlie modern leftism we call “feelings of inferiority” and “oversocialization.” Feelings of inferiority are characteristic of modern leftism as a whole, while oversocialization is characteristic only of a certain segment of modern leftism; but this segment is highly influential.
    - id: "internet_long_prompts"
      texts:
        - >
          Artificial intelligence (AI) is the capability of computational systems to
          perform tasks typically associated with human intelligence, such as learning,
          reasoning, problem-solving, perception, and decision-making. It is a field of
          research in engineering, mathematics and computer science that develops and
          studies methods and software that enable machines to perceive their environment
          and use learning and intelligence to take actions that maximize their chances of
          achieving defined goals. High-profile applications of AI include advanced web
          search engines, chatbots, virtual assistants, autonomous vehicles, and play and
          analysis in strategy games (e.g., chess and Go). Since the 2020s, generative AI
          has become widely available to generate images, audio, and videos from text
          prompts. The traditional goals of AI research include learning, reasoning,
          knowledge representation, planning, natural language processing, and perception,
          as well as support for robotics. To reach these goals, AI researchers have used
          techniques including state space search and mathematical optimization, formal
          logic, artificial neural networks, and methods based on statistics, operations
          research, and economics. AI also draws upon psychology, linguistics, philosophy,
          neuroscience, and other fields. Some companies, such as OpenAI, Google DeepMind
          and Meta, aim to create artificial general intelligence (AGI) – AI that can
          complete virtually any cognitive task at least as well as a human. Artificial
          intelligence was founded as an academic discipline in 1956, and the field went
          through multiple cycles of optimism throughout its history, followed by periods
          of disappointment and loss of funding, known as AI winters. Funding and interest
          increased substantially after 2012, when graphics processing units began being
          used to accelerate neural networks, and deep learning outperformed previous AI
          techniques. This growth accelerated further after 2017 with the transformer
          architecture. In the 2020s, an AI boom has coincided with advances in generative
          AI, which allowed for the creation and modification of media. In addition to AI
          safety and unintended consequences and harms from the use of AI, ethical
          concerns, AI's long-term effects, and potential existential risks have prompted
          discussions of AI regulation. The general problem of simulating (or creating)
          intelligence has been broken into subproblems. These consist of particular
          traits or capabilities that researchers expect an intelligent system to display.
          The traits described below have received the most attention and cover the scope
          of AI research. Early researchers developed algorithms that imitated
          step-by-step reasoning that humans use when they solve puzzles or make logical
          deductions. By the late 1980s and 1990s, methods were developed for dealing with
          uncertain or incomplete information, employing concepts from probability and
          economics. Many of these algorithms are insufficient for solving large reasoning
          problems because they experience a "combinatorial explosion": They become
          exponentially slower as the problems grow. Even humans rarely use the
          step-by-step deduction that early AI research could model. They solve most of
          their problems using fast, intuitive judgments. Accurate and efficient reasoning
          is an unsolved problem. Knowledge representation and knowledge engineering allow
          AI programs to answer questions intelligently and make deductions about
          real-world facts. Formal knowledge representations are used in content-based
          indexing and retrieval, scene interpretation, clinical decision support,
          knowledge discovery (mining "interesting" and actionable inferences from large
          databases), and other areas. A knowledge base is a body of knowledge represented
          in a form that can be used by a program. An ontology is the set of objects,
          relations, concepts, and properties used by a particular domain of knowledge.
          Knowledge bases need to represent things such as objects, properties,
          categories, and relations between objects; situations, events, states, and time;
          causes and effects; knowledge about knowledge (what we know about what other
          people know); default reasoning (things that humans assume are true until they
          are told differently and will remain true even when other facts are changing);
          and many other aspects and domains of knowledge. Among the most difficult
          problems in knowledge representation are the breadth of commonsense knowledge
          (the set of atomic facts that the average person knows is enormous); and the
          sub-symbolic form of most commonsense knowledge (much of what people know is not
          represented as "facts" or "statements" that they could express verbally). There
          is also the difficulty of knowledge acquisition, the problem of obtaining
          knowledge for AI applications. An "agent" is any entity (artificial or not) that
          perceives and takes actions in the world. A rational agent has goals or
          preferences and takes actions to make them happen. In automated planning, the
          agent has a specific goal. In automated decision-making, the agent has
          preferences—there are some situations it would prefer to be in, and some
          situations it is trying to avoid. The decision-making agent assigns a number to
          each situation (called the "utility") that measures how much the agent prefers
          it. For each possible action, it can calculate the "expected utility": the
          utility of all possible outcomes of the action, weighted by the probability that
          the outcome will occur. It can then choose the action with the maximum expected
          utility. In classical planning, the agent knows exactly what the effect of any
          action will be. In most real-world problems, however, the agent may not be
          certain about the situation they are in (it is "unknown" or "unobservable") and
          it may not know for certain what will happen after each possible action (it is
          not "deterministic"). It must choose an action by making a probabilistic guess
          and then reassess the situation to see if the action worked. Alongside thorough
          testing and improvement based on previous decisions, having an explanation for
          why the agent took certain decisions is a way to build trust, especially when
          the decisions have to be relied upon. In some problems, the agent's preferences
          may be uncertain, especially if there are other agents or humans involved. These
          can be learned (e.g., with inverse reinforcement learning), or the agent can
          seek information to improve its preferences. Information value theory can be
          used to weigh the value of exploratory or experimental actions. The space of
          possible future actions and situations is typically intractably large, so the
          agents must take actions and evaluate situations while being uncertain of what
          the outcome will be. A Markov decision process has a transition model that
          describes the probability that a particular action will change the state in a
          particular way and a reward function that supplies the utility of each state and
          the cost of each action. A policy associates a decision with each possible
          state. The policy could be calculated (e.g., by iteration), be heuristic, or it
          can be learned. Game theory describes the rational behavior of multiple
          interacting agents and is used in AI programs that make decisions that involve
          other agents. Machine learning is the study of programs that can improve their
          performance on a given task automatically. It has been a part of AI from the
          beginning. There are several kinds of machine learning. Unsupervised learning
          analyzes a stream of data and finds patterns and makes predictions without any
          other guidance. Supervised learning requires labeling the training data with the
          expected answers, and comes in two main varieties: classification (where the
          program must learn to predict what category the input belongs in) and regression
          (where the program must deduce a numeric function based on numeric input). In
          reinforcement learning, the agent is rewarded for good responses and punished
          for bad ones. The agent learns to choose responses that are classified as
          "good". Transfer learning is when the knowledge gained from one problem is
          applied to a new problem. Deep learning is a type of machine learning that runs
          inputs through biologically inspired artificial neural networks for all of these
          types of learning. Computational learning theory can assess learners by
          computational complexity, by sample complexity (how much data is required), or
          by other notions of optimization. Natural language processing (NLP) allows
          programs to read, write and communicate in human languages. Specific problems
          include speech recognition, speech synthesis, machine translation, information
          extraction, information retrieval and question answering. Early work, based on
          Noam Chomsky's generative grammar and semantic networks, had difficulty with
          word-sense disambiguation unless restricted to small domains called
          "micro-worlds" (due to the common sense knowledge problem). Margaret Masterman
          believed that it was meaning and not grammar that was the key to understanding
          languages, and that thesauri and not dictionaries should be the basis of
          computational language structure. Modern deep learning techniques for NLP
          include word embedding (representing words, typically as vectors encoding their
          meaning), transformers (a deep learning architecture using an attention
          mechanism), and others. In 2019, generative pre-trained transformer (or "GPT")
          language models began to generate coherent text, and by 2023, these models were
          able to get human-level scores on the bar exam, SAT test, GRE test, and many
          other real-world applications. Machine perception is the ability to use input
          from sensors (such as cameras, microphones, wireless signals, active lidar,
          sonar, radar, and tactile sensors) to deduce aspects of the world. Computer
          vision is the ability to analyze visual input. The field includes speech
          recognition, image classification, facial recognition, object recognition,
          object tracking, and robotic perception. Affective computing is a field that
          comprises systems that recognize, interpret, process, or simulate human feeling,
          emotion, and mood. For example, some virtual assistants are programmed to speak
          conversationally or even to banter humorously; it makes them appear more
          sensitive to the emotional dynamics of human interaction, or to otherwise
          facilitate human–computer interaction. However, this tends to give naïve users
          an unrealistic conception of the intelligence of existing computer agents.
          Moderate successes related to affective computing include textual sentiment
          analysis and, more recently, multimodal sentiment analysis, wherein AI
          classifies the effects displayed by a videotaped subject. A machine with
          artificial general intelligence would be able to solve a wide variety of
          problems with breadth and versatility similar to human intelligence. AI research
          uses a wide variety of techniques to accomplish the goals above. There are two
          different kinds of search used in AI: state space search and local search: State
          space search searches through a tree of possible states to try to find a goal
          state. For example, planning algorithms search through trees of goals and
          subgoals, attempting to find a path to a target goal, a process called
          means-ends analysis. Simple exhaustive searches are rarely sufficient for most
          real-world problems: the search space (the number of places to search) quickly
          grows to astronomical numbers. The result is a search that is too slow or never
          completes. "Heuristics" or "rules of thumb" can help prioritize choices that are
          more likely to reach a goal. Adversarial search is used for game-playing
          programs, such as chess or Go. It searches through a tree of possible moves and
          countermoves, looking for a winning position. Local search uses mathematical
          optimization to find a solution to a problem. It begins with some form of guess
          and refines it incrementally. Gradient descent is a type of local search that
          optimizes a set of numerical parameters by incrementally adjusting them to
          minimize a loss function. Variants of gradient descent are commonly used to
          train neural networks, through the backpropagation algorithm. Another type of
          local search is evolutionary computation, which aims to iteratively improve a
          set of candidate solutions by "mutating" and "recombining" them, selecting only
          the fittest to survive each generation. Distributed search processes can
          coordinate via swarm intelligence algorithms. Two popular swarm algorithms used
          in search are particle swarm optimization (inspired by bird flocking) and ant
          colony optimization (inspired by ant trails). Formal logic is used for reasoning
          and knowledge representation. Formal logic comes in two main forms:
          propositional logic (which operates on statements that are true or false and
          uses logical connectives such as "and", "or", "not" and "implies") and predicate
          logic (which also operates on objects, predicates and relations and uses
          quantifiers such as "Every X is a Y" and "There are some Xs that are Ys").
          Deductive reasoning in logic is the process of proving a new statement
          (conclusion) from other statements that are given and assumed to be true (the
          premises). Proofs can be structured as proof trees, in which nodes are labelled
          by sentences, and children nodes are connected to parent nodes by inference
          rules. Given a problem and a set of premises, problem-solving reduces to
          searching for a proof tree whose root node is labelled by a solution of the
          problem and whose leaf nodes are labelled by premises or axioms. In the case of
          Horn clauses, problem-solving search can be performed by reasoning forwards from
          the premises or backwards from the problem. In the more general case of the
          clausal form of first-order logic, resolution is a single, axiom-free rule of
          inference, in which a problem is solved by proving a contradiction from premises
          that include the negation of the problem to be solved. Inference in both Horn
          clause logic and first-order logic is undecidable, and therefore intractable.
          However, backward reasoning with Horn clauses, which underpins computation in
          the logic programming language Prolog, is Turing complete. Moreover, its
          efficiency is competitive with computation in other symbolic programming
          languages. Fuzzy logic assigns a "degree of truth" between 0 and 1. It can
          therefore handle propositions that are vague and partially true. Non-monotonic
          logics, including logic programming with negation as failure, are designed to
          handle default reasoning. Other specialized versions of logic have been
          developed to describe many complex domains. Many problems in AI (including
          reasoning, planning, learning, perception, and robotics) require the agent to
          operate with incomplete or uncertain information. AI researchers have devised a
          number of tools to solve these problems using methods from probability theory
          and economics. Precise mathematical tools have been developed that analyze how
          an agent can make choices and plan, using decision theory, decision analysis,
          and information value theory. These tools include models such as Markov decision
          processes, dynamic decision networks, game theory and mechanism design. Bayesian
          networks are a tool that can be used for reasoning (using the Bayesian inference
          algorithm), learning (using the expectation–maximization algorithm), planning
          (using decision networks) and perception (using dynamic Bayesian networks).
          Probabilistic algorithms can also be used for filtering, prediction, smoothing,
          and finding explanations for streams of data, thus helping perception systems
          analyze processes that occur over time (e.g., hidden Markov models or Kalman
          filters). The simplest AI applications can be divided into two types:
          classifiers (e.g., "if shiny then diamond"), on one hand, and controllers (e.g.,
          "if diamond then pick up"), on the other hand. Classifiers are functions that
          use pattern matching to determine the closest match. They can be fine-tuned
          based on chosen examples using supervised learning. Each pattern (also called an
          "observation") is labeled with a certain predefined class. All the observations
          combined with their class labels are known as a data set. When a new observation
          is received, that observation is classified based on previous experience. There
          are many kinds of classifiers in use. The decision tree is the simplest and most
          widely used symbolic machine learning algorithm. K-nearest neighbor algorithm
          was the most widely used analogical AI until the mid-1990s, and Kernel methods
          such as the support vector machine (SVM) displaced k-nearest neighbor in the
          1990s. The naive Bayes classifier is reportedly the "most widely used learner"
          at Google, due in part to its scalability. Neural networks are also used as
          classifiers. An artificial neural network is based on a collection of nodes also
          known as artificial neurons, which loosely model the neurons in a biological
          brain. It is trained to recognise patterns; once trained, it can recognise those
          patterns in fresh data. There is an input, at least one hidden layer of nodes
          and an output. Each node applies a function and once the weight crosses its
          specified threshold, the data is transmitted to the next layer. A network is
          typically called a deep neural network if it has at least 2 hidden layers.
          Learning algorithms for neural networks use local search to choose the weights
          that will get the right output for each input during training. The most common
          training technique is the backpropagation algorithm. Neural networks learn to
          model complex relationships between inputs and outputs and find patterns in
          data. In theory, a neural network can learn any function. In feedforward neural
          networks the signal passes in only one direction. The term perceptron typically
          refers to a single-layer neural network. In contrast, deep learning uses many
          layers. Recurrent neural networks (RNNs) feed the output signal back into the
          input, which allows short-term memories of previous input events. Long
          short-term memory networks (LSTMs) are recurrent neural networks that better
          preserve longterm dependencies and are less sensitive to the vanishing gradient
          problem. Convolutional neural networks (CNNs) use layers of kernels to more
          efficiently process local patterns. This local processing is especially
          important in image processing, where the early CNN layers typically identify
          simple local patterns such as edges and curves, with subsequent layers detecting
          more complex patterns like textures, and eventually whole objects. Deep learning
          uses several layers of neurons between the network's inputs and outputs. The
          multiple layers can progressively extract higher-level features from the raw
          input. For example, in image processing, lower layers may identify edges, while
          higher layers may identify the concepts relevant to a human such as digits,
          letters, or faces. Deep learning has profoundly improved the performance of
          programs in many important subfields of artificial intelligence, including
          computer vision, speech recognition, natural language processing, image
          classification, and others. The reason that deep learning performs so well in so
          many applications is not known as of 2021. The sudden success of deep learning
          in 2012–2015 did not occur because of some new discovery or theoretical
          breakthrough (deep neural networks and backpropagation had been described by
          many people, as far back as the 1950s) but because of two factors: the
          incredible increase in computer power (including the hundred-fold increase in
          speed by switching to GPUs) and the availability of vast amounts of training
          data, especially the giant curated datasets used for benchmark testing, such as
          ImageNet. Generative pre-trained transformers (GPT) are large language models
          (LLMs) that generate text based on the semantic relationships between words in
          sentences. Text-based GPT models are pre-trained on a large corpus of text that
          can be from the Internet. The pretraining consists of predicting the next token
          (a token being usually a word, subword, or punctuation). Throughout this
          pretraining, GPT models accumulate knowledge about the world and can then
          generate human-like text by repeatedly predicting the next token. Typically, a
          subsequent training phase makes the model more truthful, useful, and harmless,
          usually with a technique called reinforcement learning from human feedback
          (RLHF). Current GPT models are prone to generating falsehoods called
          "hallucinations". These can be reduced with RLHF and quality data, but the
          problem has been getting worse for reasoning systems. Such systems are used in
          chatbots, which allow people to ask a question or request a task in simple text.
          Current models and services include ChatGPT, Claude, Gemini, Copilot, and Meta
          AI. Multimodal GPT models can process different types of data (modalities) such
          as images, videos, sound, and text. In the late 2010s, graphics processing units
          (GPUs) that were increasingly designed with AI-specific enhancements and used
          with specialized TensorFlow software had replaced previously used central
          processing unit (CPUs) as the dominant means for large-scale (commercial and
          academic) machine learning models' training. Specialized programming languages
          such as Prolog were used in early AI research, but general-purpose programming
          languages like Python have become predominant. The transistor density in
          integrated circuits has been observed to roughly double every 18 months—a trend
          known as Moore's law, named after the Intel co-founder Gordon Moore, who first
          identified it. Improvements in GPUs have been even faster, a trend sometimes
          called Huang's law, named after Nvidia co-founder and CEO Jensen Huang. AI and
          machine learning technology is used in most of the essential applications of the
          2020s, including: search engines (such as Google Search) targeting online
          advertisements recommendation systems (offered by Netflix, YouTube or Amazon)
          driving internet traffic targeted advertising (AdSense, Facebook) virtual
          assistants (such as Siri or Alexa) autonomous vehicles (including drones, ADAS
          and self-driving cars) automatic language translation (Microsoft Translator,
          Google Translate) facial recognition (Apple's FaceID or Microsoft's DeepFace and
          Google's FaceNet) image labeling (used by Facebook, Apple's Photos and TikTok).
          The deployment of AI may be overseen by a chief automation officer (CAO). It has
          been suggested that AI can overcome discrepancies in funding allocated to
          different fields of research. AlphaFold 2 (2021) demonstrated the ability to
          approximate, in hours rather than months, the 3D structure of a protein. In
          2023, it was reported that AI-guided drug discovery helped find a class of
          antibiotics capable of killing two different types of drug-resistant bacteria.
          In 2024, researchers used machine learning to accelerate the search for
          Parkinson's disease drug treatments. Their aim was to identify compounds that
          block the clumping, or aggregation, of alpha-synuclein (the protein that
          characterises Parkinson's disease). They were able to speed up the initial
          screening process ten-fold and reduce the cost by a thousand-fold. Game playing
          programs have been used since the 1950s to demonstrate and test AI's most
          advanced techniques. Deep Blue became the first computer chess-playing system to
          beat a reigning world chess champion, Garry Kasparov, on 11 May 1997. In 2011,
          in a Jeopardy! quiz show exhibition match, IBM's question answering system,
          Watson, defeated the two greatest Jeopardy! champions, Brad Rutter and Ken
          Jennings, by a significant margin. In March 2016, AlphaGo won 4 out of 5 games
          of Go in a match with Go champion Lee Sedol, becoming the first computer
          Go-playing system to beat a professional Go player without handicaps. Then, in
          2017, it defeated Ke Jie, who was the best Go player in the world. Other
          programs handle imperfect-information games, such as the poker-playing program
          Pluribus. DeepMind developed increasingly generalistic reinforcement learning
          models, such as with MuZero, which could be trained to play chess, Go, or Atari
          games. In 2019, DeepMind's AlphaStar achieved grandmaster level in StarCraft II,
          a particularly challenging real-time strategy game that involves incomplete
          knowledge of what happens on the map. In 2021, an AI agent competed in a
          PlayStation Gran Turismo competition, winning against four of the world's best
          Gran Turismo drivers using deep reinforcement learning. In 2024, Google DeepMind
          introduced SIMA, a type of AI capable of autonomously playing nine previously
          unseen open-world video games by observing screen output, as well as executing
          short, specific tasks in response to natural language instructions. In
          mathematics, probabilistic large language models are versatile, but can also
          produce wrong answers in the form of hallucinations. The Alibaba Group developed
          a version of its Qwen models called Qwen2-Math, that achieved state-of-the-art
          performance on several mathematical benchmarks, including 84% accuracy on the
          MATH dataset of competition mathematics problems. In January 2025, Microsoft
          proposed the technique rStar-Math that leverages Monte Carlo tree search and
          step-by-step reasoning, enabling a relatively small language model like Qwen-7B
          to solve 53% of the AIME 2024 and 90% of the MATH benchmark problems. Google
          DeepMind has developed models for solving mathematical problems: AlphaTensor,
          AlphaGeometry, AlphaProof and AlphaEvolve. When natural language is used to
          describe mathematical problems, converters can transform such prompts into a
          formal language such as Lean to define mathematical tasks. The experimental
          model Gemini Deep Think accepts natural language prompts directly and achieved
          gold medal results in the International Math Olympiad of 2025. Topological deep
          learning integrates various topological approaches. According to Nicolas Firzli,
          director of the World Pensions & Investments Forum, it may be too early to see
          the emergence of highly innovative AI-informed financial products and services.
          He argues that "the deployment of AI tools will simply further automatise
          things: destroying tens of thousands of jobs in banking, financial planning, and
          pension advice in the process, but I'm not sure it will unleash a new wave of
          [e.g., sophisticated] pension innovation." Various countries are deploying AI
          military applications. The main applications enhance command and control,
          communications, sensors, integration and interoperability. Research is targeting
          intelligence collection and analysis, logistics, cyber operations, information
          operations, and semiautonomous and autonomous vehicles. AI technologies enable
          coordination of sensors and effectors, threat detection and identification,
          marking of enemy positions, target acquisition, coordination and deconfliction
          of distributed Joint Fires between networked combat vehicles, both
          human-operated and autonomous. AI has been used in military operations in Iraq,
          Syria, Israel and Ukraine. AI agents are software entities designed to perceive
          their environment, make decisions, and take actions autonomously to achieve
          specific goals. These agents can interact with users, their environment, or
          other agents. AI agents are used in various applications, including virtual
          assistants, chatbots, autonomous vehicles, game-playing systems, and industrial
          robotics. AI agents operate within the constraints of their programming,
          available computational resources, and hardware limitations. This means they are
          restricted to performing tasks within their defined scope and have finite memory
          and processing capabilities. In real-world applications, AI agents often face
          time constraints for decision-making and action execution. Many AI agents
          incorporate learning algorithms, enabling them to improve their performance over
          time through experience or training. Using machine learning, AI agents can adapt
          to new situations and optimise their behaviour for their designated tasks.
          Microsoft introduced Copilot Search in February 2023 under the name Bing Chat.
          Copilot Search provides AI-generated summaries. Google introduced an AI Mode at
          its Google I/O event on 20 May 2025. Applications of AI in this domain include
          AI-enabled menstruation and fertility trackers that analyze user data to offer
          predictions, AI-integrated sex toys (e.g., teledildonics), AI-generated sexual
          education content, and AI agents that simulate sexual and romantic partners
          (e.g., Replika). AI is also used for the production of non-consensual deepfake
          pornography, raising significant ethical and legal concerns. AI technologies
          have also been used to attempt to identify online gender-based violence and
          online sexual grooming of minors. In a 2017 survey, one in five companies
          reported having incorporated "AI" in some offerings or processes. In the field
          of evacuation and disaster management, AI has been used to investigate patterns
          in large-scale and small-scale evacuations using historical data from GPS,
          videos or social media. During the 2024 Indian elections, US$50 million was
          spent on authorized AI-generated content, notably by creating deepfakes of
          allied (including sometimes deceased) politicians to better engage with voters,
          and by translating speeches to various local languages. The use of generative AI
          by law firms for legal research resulted in the creation of the global "AI
          Hallucination Cases" database, in April 2025, established by HEC Paris and
          Sciences Po legal data analysis lecturer Damien Charlotin. By 2026, judges had
          issued sanctions and bar associations had issued warnings due to attorney
          submissions to the courts containing fabricated case law citations hallucinated
          by AI tools. AI has potential benefits and potential risks. AI may be able to
          advance science and find solutions for serious problems: Demis Hassabis of
          DeepMind hopes to "solve intelligence, and then use that to solve everything
          else". However, as the use of AI has become widespread, several unintended
          consequences and risks have been identified. In-production systems can sometimes
          not factor ethics and bias into their AI training processes, especially when the
          AI algorithms are inherently unexplainable in deep learning. Machine learning
          algorithms require large amounts of data. The techniques used to acquire this
          data have raised concerns about privacy, surveillance and copyright.
        - >
          World War II, or the Second World War (1 September 1939 – 2 September 1945),
          was a global conflict between two coalitions: the Allies and the Axis powers.
          Nearly all of the world's countries participated. Tanks and aircraft played
          major roles, the latter enabling the strategic bombing of cities and delivery of
          the only nuclear weapons used in war. World War II was the deadliest conflict in
          history, causing the death of 60 to 75 million people. Millions died as a result
          of massacres, starvation, disease, and genocides, including the Holocaust. After
          the Allied victory, Germany, Austria, Japan, and Korea were occupied, and German
          and Japanese leaders were tried for war crimes. The causes of World War II
          included unresolved tensions in the aftermath of World War I and the rise of
          fascism in Europe and militarism in Japan. Key events preceding the war included
          Japan's invasion of Manchuria in 1931, the Spanish Civil War, the outbreak of
          the Second Sino-Japanese War in 1937, and Germany's annexations of Austria and
          the Sudetenland. World War II is generally considered to have begun on 1
          September 1939, when Nazi Germany, under Adolf Hitler, invaded Poland, after
          which the United Kingdom and France declared war on Germany. Poland was also
          invaded by the Soviet Union in mid-September and was partitioned between Germany
          and the Soviet Union under the Molotov–Ribbentrop Pact. In 1940, the Soviet
          Union annexed the Baltic states and parts of Finland and Romania, while Germany
          conquered Norway, Denmark, Belgium, Luxembourg, and the Netherlands. After the
          fall of France in June 1940, the war continued mainly between Germany, now
          assisted by Fascist Italy, and the British Empire and British Commonwealth, with
          fighting in the Balkans, Mediterranean, Middle East, East Africa, the aerial
          Battle of Britain, the Blitz, and the naval Battle of the Atlantic. By mid-1941,
          Yugoslavia and Greece had also been defeated by Axis countries. In June 1941,
          Germany invaded the Soviet Union, opening the Eastern Front. In December 1941,
          Japan attacked American and British territories in Asia and the Pacific,
          including Pearl Harbor in Hawaii, leading the United States to enter the war
          against the Axis. Japan conquered much of coastal China and Southeast Asia, but
          its advances in the Pacific were halted in June 1942 at the Battle of Midway. In
          early 1943, Axis forces were defeated in North Africa and at Stalingrad in the
          Soviet Union. An Allied invasion of Italy in July resulted in the fall of its
          fascist regime, and Allied offensives in the Pacific and the Soviet Union forced
          the Axis to retreat on all fronts. In 1944, the Western Allies invaded France at
          Normandy, and the Soviet Union advanced into Central Europe. Japan also suffered
          major setbacks including the crippling of its navy by the United States, the
          loss of key Western Pacific islands, and defeats in Burma. The war in Europe
          concluded with the liberation of German-occupied territories and the invasion of
          Germany by the Allies, which culminated in the fall of Berlin to Soviet troops
          and Germany's unconditional surrender on 8 May 1945. On 6 and 9 August, the US
          dropped atomic bombs on Hiroshima and Nagasaki followed by a Soviet invasion of
          Japanese-occupied Manchuria. Japan announced its unconditional surrender on 15
          August and signed a surrender document on 2 September 1945. World War II
          transformed the political, economic, and social structures of the world, and
          established the foundation of international relations for the rest of the 20th
          century and into the 21st century. The United Nations was created to foster
          international cooperation and prevent future conflicts, with the victorious
          great powers—China, France, the Soviet Union, the UK, and the US—becoming the
          permanent members of its Security Council. The Soviet Union and the US emerged
          as rival superpowers, setting the stage for the Cold War. In the wake of
          Europe's devastation, the influence of its great powers waned, triggering the
          decolonisation of Africa and of Asia. Many countries whose industries had been
          damaged moved towards economic recovery and expansion. Most historians agree
          that World War II began with the German invasion of Poland on 1 September 1939
          and the British and French declarations of war on Germany two days later. Dates
          for the beginning of the Pacific War include the start of the Second
          Sino-Japanese War on 7 July 1937, or the earlier Japanese invasion of Manchuria
          on 18 September 1931. Other proposed starting dates include the Italian invasion
          of Abyssinia on 3 October 1935. The British historian Antony Beevor views the
          beginning of World War II as the Battles of Khalkhin Gol fought between Japan
          and the forces of Mongolia and the Soviet Union from May to September 1939.
          Others view the Spanish Civil War as the start or prelude to World War II. The
          date of the war's end is also not universally agreed upon. It was generally
          accepted at the time that the war ended with the armistice of 15 August 1945
          (V-J Day), rather than with the formal surrender of Japan on 2 September 1945,
          which officially ended the war in Asia. A peace treaty between Japan and the
          Allies was signed in 1951. A 1990 treaty regarding Germany's future allowed the
          reunification of East and West Germany to take place. No formal peace treaty
          between Japan and the Soviet Union was ever signed, although the state of war
          between the two countries was terminated by the Soviet–Japanese Joint
          Declaration of 1956, which also restored full diplomatic relations between them.
          World War I radically altered the European political map. The most prominent
          nations of the Central Powers each lost territory in their respective peace
          treaties at the conclusion of the conflict. New nation-states were created out
          of the dissolution of the Austro-Hungarian, Ottoman, and Russian Empires. To
          prevent a future world war, the League of Nations was established in 1920 by the
          Paris Peace Conference. The organisation's primary function was to prevent armed
          conflict through collective security, military, and naval disarmament, as well
          as settling international disputes through peaceful negotiations and
          arbitration. Despite strong pacifist sentiment after World War I, irredentist
          and revanchist nationalism had emerged in several European states. These
          sentiments were especially pronounced in Germany due to the significant
          territorial, colonial, and financial losses imposed by the Treaty of Versailles.
          Under the treaty, Germany lost around 13 percent of its home territory and all
          its overseas possessions, while German annexation of other states was
          prohibited, reparations were imposed, and limits were placed on the size and
          capability of the country's armed forces. The German Empire was dissolved in the
          German revolution of 1918–1919, and a democratic government, later known as the
          Weimar Republic, was created. The interwar period saw strife between supporters
          of the new republic and hardline opponents on both the political right and left.
          Italy, as an Entente ally, had made some post-war territorial gains; however,
          Italian nationalists were angered that the promises made by the United Kingdom
          and France to secure Italian entrance into the war were not fulfilled in the
          peace settlement. From 1922 to 1925, the fascist movement led by Benito
          Mussolini seized power in Italy with a nationalist, totalitarian, and class
          collaborationist agenda that abolished representative democracy, repressed
          socialist, left-wing, and liberal forces, and pursued an aggressive expansionist
          foreign policy aimed at making Italy a world power, promising the creation of a
          "New Roman Empire". Adolf Hitler, after an unsuccessful attempt to overthrow the
          German government in 1923, eventually became the chancellor of Germany in 1933
          when President Paul von Hindenburg and the Reichstag appointed him. The Nazis
          soon abolished parliamentary democracy, espousing a radical, racially motivated
          revision of the world order, and began a massive rearmament campaign. Following
          Hindenburg's death in 1934, Hitler proclaimed himself Führer of Germany. France,
          seeking to secure its alliance with Italy, allowed Italy a free hand in
          Ethiopia, which Italy desired as a colonial possession. The situation was
          aggravated in early 1935 when the Territory of the Saar Basin was legally
          reunited with Germany, and Hitler repudiated the Treaty of Versailles,
          accelerated his rearmament programme, and introduced conscription. The United
          Kingdom, France and Italy formed the Stresa Front in April 1935 in order to
          contain Germany, a key step towards military globalisation; however, that June,
          the United Kingdom made an independent naval agreement with Germany, easing
          prior restrictions. The Soviet Union, concerned by Germany's goals of capturing
          vast areas of Eastern Europe, drafted a treaty of mutual assistance with France.
          Before taking effect, though, the Franco-Soviet pact was required to go through
          the bureaucracy of the League of Nations, which rendered it essentially
          toothless. The United States, concerned with events in Europe and Asia, passed
          the Neutrality Act in August of the same year. Hitler defied the Versailles and
          Locarno Treaties by remilitarising the Rhineland in March 1936, encountering
          little opposition due to the policy of appeasement. In October 1936, Germany and
          Italy formed the Rome–Berlin Axis. A month later, Germany and Japan signed the
          Anti-Comintern Pact, which Italy joined the following year. The Kuomintang party
          in China launched a unification campaign against regional warlords and nominally
          unified China in the mid-1920s, but was soon embroiled in a civil war against
          its former Chinese Communist Party (CCP) allies and new regional warlords. In
          1931, an increasingly militaristic Empire of Japan, which had long sought
          influence in China as the first step of what its government saw as the country's
          right to rule Asia, staged the Mukden incident as a pretext to invade Manchuria
          and establish the puppet state of Manchukuo. China appealed to the League of
          Nations to stop the Japanese invasion of Manchuria. Japan withdrew from the
          League of Nations after being condemned for its incursion into Manchuria. The
          two nations then fought several battles, in Shanghai, Rehe, and Hebei, until the
          Tanggu Truce was signed in 1933. Thereafter, Chinese volunteer forces continued
          the resistance to Japanese aggression in Manchuria, and Chahar and Suiyuan.
          After the 1936 Xi'an Incident, the Kuomintang and CCP forces agreed on a
          ceasefire to present a united front to oppose Japan. The Second Italo-Ethiopian
          War was a colonial war that began in October 1935 and ended in May 1936. The war
          began with the invasion of the Ethiopian Empire (also known as Abyssinia) by the
          armed forces of the Kingdom of Italy (Regno d'Italia), which was launched from
          Italian Somaliland and Eritrea. The war resulted in the military occupation of
          Ethiopia and its annexation into the newly created colony of Italian East Africa
          (Africa Orientale Italiana); in addition it exposed the weakness of the League
          of Nations as a force to preserve peace. Both Italy and Ethiopia were member
          nations, but the League did little when the former clearly violated Article X of
          the League's Covenant. The United Kingdom and France supported imposing
          sanctions on Italy for the invasion, although the sanctions were not fully
          enforced and failed to end the Italian invasion. Italy subsequently dropped its
          objections to Germany's goal of absorbing Austria. When civil war broke out in
          Spain, Hitler and Mussolini lent military support to the Nationalist rebels, led
          by General Francisco Franco. Italy supported the Nationalists to a greater
          extent than the Nazis: Mussolini sent more than 70,000 ground troops, 6,000
          aviation personnel, and 720 aircraft to Spain. The Soviet Union supported the
          existing government of the Spanish Republic. More than 30,000 foreign
          volunteers, known as the International Brigades, also fought against the
          Nationalists. Both Germany and the Soviet Union used this proxy war as an
          opportunity to test in combat their most advanced weapons and tactics. The
          Nationalists won the civil war in April 1939; Franco, now dictator, remained
          officially neutral during World War II but generally favoured the Axis. His
          largest collaboration with Germany was the sending of volunteers to fight on the
          Eastern Front. In July 1937, Japan captured the former Chinese imperial capital
          of Peking after instigating the Marco Polo Bridge incident, which culminated in
          the Japanese campaign to invade all of China following years of tension and
          low-level conflicts. The Soviets quickly signed a non-aggression pact with China
          to lend materiel support, effectively ending China's prior cooperation with
          Germany. From September to November, the Japanese attacked Taiyuan, engaged the
          Kuomintang Army around Xinkou, fought Communist forces in Pingxingguan,Yang
          Kuisong, "On the reconstruction of the facts of the Battle of Pingxingguan" and
          wrestled control over China's northern railway network. Nationalist
          Generalissimo Chiang Kai-shek deployed his best army to defend Shanghai, but
          after three months of heavy fighting, Shanghai fell. The Japanese continued to
          push Chinese forces back, capturing the capital Nanking in December 1937. In
          March 1938, Nationalist Chinese forces won their first major victory at
          Taierzhuang, but ultimately lost control of the city of Xuzhou in May. In June
          1938, Chinese forces stalled the Japanese advance by flooding the Yellow River;
          buying time for the Chinese to prepare their defences at Wuhan at heavy cost to
          the local civilian population, but the city was taken by October after heavy
          fighting along the Yangtze River. Japanese military victories did not destroy
          Chinese resistance; instead, the Chinese government relocated inland to
          Chongqing and continued the war. Aiming to break Chinese morale, Japanese
          aircraft began striking cities in the Sichuan basin in a bombing campaign,
          killing tens of thousands of civilians. In the mid-to-late 1930s, Japanese
          forces in Manchukuo had sporadic border clashes with the Soviet Union and
          Mongolia. The Japanese doctrine of Hokushin-ron, which emphasised Japan's
          expansion northward, was favoured by the Imperial Army during this time. This
          policy would prove difficult to maintain in light of the Japanese defeat at
          Khalkin Gol in 1939, the ongoing Second Sino-Japanese War and ally Nazi Germany
          pursuing neutrality with the Soviets. Japan and the Soviet Union eventually
          signed a Neutrality Pact in April 1941, and Japan adopted the doctrine of
          Nanshin-ron, promoted by the Navy, which took its focus southward and eventually
          led to war with the United States and the Western Allies. In Europe, Germany and
          Italy were becoming more aggressive. In March 1938, Germany annexed Austria,
          again provoking little response from other European powers. Encouraged, Hitler
          began pressing German claims on the Sudetenland, an area of Czechoslovakia with
          a predominantly ethnic German population. Soon the United Kingdom and France
          followed the appeasement policy of British Prime Minister Neville Chamberlain
          and conceded this territory to Germany in the Munich Agreement, which was made
          against the wishes of the Czechoslovak government, in exchange for a promise of
          no further territorial demands. Soon afterwards, Germany and Italy forced
          Czechoslovakia to cede additional territory to Hungary, and Poland annexed the
          Trans-Olza region of Czechoslovakia. Although all of Germany's stated demands
          had been satisfied by the agreement, privately Hitler was furious that British
          interference had prevented him from seizing all of Czechoslovakia in one
          operation. In subsequent speeches Hitler attacked British and Jewish
          "war-mongers" and in January 1939 secretly ordered a major build-up of the
          German navy to challenge British naval supremacy. In March 1939, Germany invaded
          the remainder of Czechoslovakia and subsequently split it into the German
          Protectorate of Bohemia and Moravia and a pro-German client state, the Slovak
          Republic. Hitler also delivered an ultimatum to Lithuania on 20 March 1939,
          forcing the concession of the Klaipėda Region, formerly the German Memelland.
          Following further demands from Hitler regarding the Free City of Danzig and the
          Polish corridor, the United Kingdom and France guaranteed their support for
          Polish independence. When Italy conquered Albania in April 1939, the same
          guarantee was extended to the Kingdoms of Romania and Greece. Shortly after the
          Franco-British pledge to Poland, Germany and Italy formalised their own alliance
          with the Pact of Steel. Hitler accused the United Kingdom and Poland of trying
          to encircle Germany and renounced the Anglo-German Naval Agreement and the
          German–Polish declaration of non-aggression. The situation became a crisis in
          late August as Germany concentrated its forces near the Polish border. On 23
          August, the Soviet Union signed a non-aggression pact with Germany, after
          tripartite negotiations for a military alliance between France, the United
          Kingdom, and Soviet Union had stalled. This pact had a secret protocol that
          defined German and Soviet spheres of influence: Lithuania for Germany; Finland,
          Estonia, Latvia and Bessarabia for the Soviet Union; and Poland to be
          partitioned between the two powers. The pact ensured that Germany would not face
          a war with the Soviet Union when it invaded Poland. Immediately afterwards,
          Hitler ordered the attack to proceed on 26 August, but upon hearing that the
          United Kingdom had concluded a formal mutual assistance pact with Poland and
          that Italy would maintain neutrality, he decided to delay it. Germany offered
          Britain an alliance if Britain helped Germany gain Danzig, the Polish corridor
          and its former colonies, but Britain replied that it would honour its guarantee
          to Poland. On 29 August, Hitler demanded that a Polish plenipotentiary travel to
          Berlin by the following day to negotiate a solution to the crisis, but Britain
          rejected the timeline as unreasonable. On the night of 30–31 August, the British
          ambassador Nevile Henderson met German Foreign Minister Joachim von Ribbentrop.
          Ribbentrop handed him Hitler's demands regarding Poland then announced that the
          deadline for Poland's acceptance had already passed. On 1 September 1939,
          Germany invaded Poland after having staged several false flag border incidents
          as a pretext to initiate the invasion. The first German attack of the war came
          against the Polish defences at Westerplatte. The United Kingdom responded with
          an ultimatum for Germany to cease military operations, and on 3 September, after
          the ultimatum was ignored, Britain and France declared war on Germany. During
          the Phoney War period, the alliance provided no direct military support to
          Poland, outside of a cautious French probe into the Saarland. The Western Allies
          also began a naval blockade of Germany, which aimed to damage the country's
          economy and war effort. Germany responded by ordering U-boat warfare against
          Allied merchant and warships, which would later escalate into the Battle of the
          Atlantic. On 8 September, German troops reached the suburbs of Warsaw. The
          Polish counter-offensive to the west halted the German advance for several days,
          but it was outflanked and encircled by the Wehrmacht. Remnants of the Polish

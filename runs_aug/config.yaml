model:
  name: "deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B"
  local_dir: "."
  device: "cuda"
  dtype: "bfloat16"

experiment:
  results_dir: "./results_perturbations"
  seed: [420, 69, 42, 10]  # Can be a single integer or a list of integers
  n_conditions: 1000
  radii: [0.001, 0.0001, 0.00005, 0.00001]
  subspace_mode: "random"
  remove_bos_token: true
  selected_layers: "all"  # or specify a list of integers e.g., [0, 12, 24]
  batch_size: 64
  
  prompts:
    - id: "singles"
      texts: ["The", "House", "she", " understanding", "id", "sex", "cat", "a", "win", "fly"]

    # - id: "long_prompt"
    #   text: "This is a longer prompt to test how perturbations propagate across layers in a deep neural network and see the attention mechanism coupling."

  # The different setups we want to run
  setups:
    - name: "single_token_perturb_all"
      prompt_id: "singles"
      mode: "all"
      m_tokens: null
      max_new_tokens: 0
    
    # - name: "long_prompt_perturb_all"
    #   prompt_id: "long_prompt"
    #   mode: "all"
    #   m_tokens: null
    #   max_new_tokens: 0
      
    # - name: "long_prompt_perturb_first_m"
    #   prompt_id: "long_prompt"
    #   mode: "first_m"
    #   m_tokens: 3
    #   max_new_tokens: 0
      
    # - name: "long_prompt_autoregressive"
    #   prompt_id: "long_prompt"
    #   mode: "all"
    #   m_tokens: null
    #   max_new_tokens: 10

analysis:
  distance_metric: "L2"  # Options: "L2", "cos"
  metric: ["mean", "median", "mode"]  # Options: mean, median, mode, individual
  error_bars: "std"    # Options: none, std, var
  eval_tokens: "last"  # Options: "last" (only measure last token), "all" (flatten sequence)

plotting:
  metric: ["mean", "median"]  # Options: mean, median, mode, individual
  error_bars: "std"    # Options: none, std, var
  plot_prompt_together: true
  plot_prompt_separated: true
  separate_figure_metrics: true

